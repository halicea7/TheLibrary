[project]
name = "library-agent"
version = "0.1.0"
description = "Local-only conversational interface to a personal library of papers, books, and docs"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1",
    # config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "numpy>=2.0",  # cartridge vectors, claim anchors; not only the reranker's
    "scikit-learn>=1.6",  # threads: HDBSCAN over the claims
    # jobs
    "arq>=0.26",
    "redis>=5.2",
    # llm
    "httpx>=0.28",
    # ingest
    "pymupdf>=1.25",
    "markdown-it-py>=3.0",
    "tiktoken>=0.8",
    "pillow>=12.3.0",
    "mcp>=2.2.0",
    "markdownify>=1.2.3",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# The reranker: a cross-encoder in-process. Without it Find and Ask go unreranked.
ml = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

# On Linux (the container, CI), torch comes as the CPU build: the reranker is a small
# cross-encoder, and the CUDA build would add several GB for nothing. macOS is unchanged.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
