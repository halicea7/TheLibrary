        ${d.tier === 1 ? `<button class="linkish" onclick="readDoc('${d.id}', 2)">annotate it</button>` : ''}
        <button class="linkish danger" onclick="removeDoc('${d.id}', this)">remove</button>
      </div>
    </div>`;
}

async function loadShelf() {
  const [docs, cats] = await Promise.all([
    (await fetch('/api/documents')).json(),
    (await fetch('/api/categories')).json(),
  ]);
  catIndex = Object.fromEntries(cats.map(c => [c.name, c.id]));
  if (!docs.length) {
    $('#shelf').innerHTML = `<div class="empty"><b>Nothing shelved yet.</b>Drop a paper above. It is searchable within seconds; reading it takes a few minutes more.</div>`;
    return;
  }
  // Top shelf › sub-shelf › volume. Each volume sits in exactly one place; anything the
  // library has not shelved yet waits at the bottom.
  const shown = cartridges.size ? docs.filter(d => d.cartridge && cartridges.has(d.cartridge.id)) : docs;
  const tops = {};
  const waiting = [];
  for (const d of shown) {
    if (!d.shelf) { waiting.push(d); continue; }
    const top = (tops[d.shelf.top] ||= { id: d.shelf.top_id, subs: {}, n: 0 });
    (top.subs[d.shelf.sub] ||= { id: d.shelf.sub_id, vols: [] }).vols.push(d);
    top.n++;
  }
  const byCount = (a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0]);
  const group = (key, name, id, n, inner, cls = 'shelf-group') => {
    const open = !collapsed.has(key);
    return `<div class="${cls}" data-open="${open}">
      <div class="shelf-h">
        <button class="caret" aria-expanded="${open}" aria-label="Collapse ${esc(name)}" onclick="toggleGroup('${esc(key).replace(/'/g,"\\'")}')">▾</button>
        <button class="shelf-name" aria-pressed="${!!(id && subjects.has(id))}" title="${id ? 'Narrow to this shelf' : ''}"
                onclick="${id ? `toggleSubject('${id}')` : ''}">${esc(name)}</button>
        <span class="shelf-n">${n}</span>
      </div>
      <div class="shelf-vols">${inner}</div>
    </div>`;
  };
  let h = Object.entries(tops).sort(byCount).map(([tname, top]) => {
    const subs = Object.entries(top.subs).sort((a, b) => b[1].vols.length - a[1].vols.length || a[0].localeCompare(b[0]));
    const inner = subs.map(([sname, sub]) => {
      const key = tname + ' › ' + sname;
      // Sub-shelves start closed unless opened before: twenty open runs is a wall.
      if (!collapsed.has(key) && !opened.has(key)) collapsed.add(key);
      return group(key, sname, sub.id, sub.vols.length, sub.vols.map(volHtml).join(''), 'shelf-sub');
    }).join('');
    return group(tname, tname, top.id, top.n, inner);
  }).join('');
  if (waiting.length) {
    const read = waiting.filter(d => d.tier >= 1), unread = waiting.filter(d => d.tier === 0);
    const label = read.length ? 'Not yet shelved' : 'Not yet read';
    h += group('__waiting', label, null, waiting.length,
      (read.length && Object.keys(tops).length ? `<div class="empty" style="padding:4px 0 8px">Read, but the shelf has not placed ${read.length === 1 ? 'it' : 'them'} yet — <button class="linkish" onclick="reshelve(this, false)">shelve now</button></div>` : '')
      + [...read, ...unread].map(volHtml).join(''));
  }
  $('#shelf').innerHTML = h;
  shelfActs(shown);
}
// Batch reading for what is in view: read the unread, annotate the read. Scoped like the
// shelf itself -- a seated cartridge or a chosen subject narrows it -- and two-step armed,
// because it is hours of background work.
function shelfActs(shown) {
  const el = $('#shelf-acts'); if (!el) return;
  if (subjects.size) {
    // Chips do not narrow the shelf listing, but they do narrow this: a top shelf takes
    // everything beneath it, a sub-shelf its own, any other subject its tagged volumes.
    const names = new Set(Object.entries(catIndex).filter(([, id]) => subjects.has(id)).map(([n]) => n));
    shown = shown.filter(d => (d.shelf && (subjects.has(d.shelf.top_id) || subjects.has(d.shelf.sub_id))) || (d.categories || []).some(c => names.has(c)));
  }
  const unread = shown.filter(d => d.tier === 0 && d.status === 'ready').length;
  const read = shown.filter(d => d.tier === 1).length;
  const where = roomName() ? `in ${roomName()}'s shelf` : subjects.size === 1 ? 'on this shelf' : subjects.size ? 'in these subjects' : 'on the whole shelf';
  el.innerHTML = (unread ? `<button class="linkish" onclick="backfill(this, 1, ${unread})" title="Queue Tier 1 reading for every unread volume ${where}">read the ${unread} unread</button>` : '')
    + (read ? `<button class="linkish" onclick="backfill(this, 2, ${read})" title="Queue Tier 2 annotation for every read volume ${where}">annotate the ${read} read</button>` : '')
    + (!unread && !read && shown.length ? `<span>everything here is annotated</span>` : '')
    + (subjects.size === 1 && shown.length ? `<button class="linkish" onclick="reshelveHere(this, ${shown.length})" title="Re-place these volumes on the shelf, keeping the shelves as they are">re-shelve these ${shown.length}</button>` : '');
}
async function reshelveHere(btn, n) {
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = `re-shelve ${n} — a minute or so of background work, sure?`;
    setTimeout(() => { btn.dataset.armed = ''; loadShelf(); }, 6000);
    return;
  }
  await fetch('/api/shelf/reshelve?' + new URLSearchParams({ category_id: [...subjects][0] }), { method: 'POST' });
  say(`Re-shelving ${n} volumes. Each is placed again from what it says, not where it sits; the shelf redraws as they land.`);
  loadJobs();
}
async function backfill(btn, tier, n) {
  const mins = Math.round(n * (tier === 2 ? 1.5 : 2.5));
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = `${tier === 2 ? 'annotate' : 'read'} ${n} — about ${mins < 90 ? mins + ' min' : Math.round(mins / 60) + ' h'} of background work, sure?`;
    setTimeout(() => { btn.dataset.armed = ''; loadShelf(); }, 6000);
    return;
  }
  const params = new URLSearchParams({ tier });
  if (tier === 2) params.set('only_tier', 1);
  if (cartridges.size === 1) params.set('cartridge_id', [...cartridges][0]);
  else if (subjects.size === 1) params.set('category_id', [...subjects][0]);
  const j = await (await fetch('/api/read/backfill?' + params, { method: 'POST' })).json();
  say(`Queued ${j.queued} for ${tier === 2 ? 'annotation' : 'reading'}${j.already_queued ? ` (${j.already_queued} were already in hand)` : ''}. The worker takes them one at a time; the shelf fills in as it goes.`);
  loadJobs(); loadShelf();
}
const opened = new Set(JSON.parse(localStorage.getItem('shelf.opened') || '[]'));

async function reshelve(btn, rebuild = true) {
  if (rebuild && btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.textContent = 'reshelve — rebuild the whole shelf?';
    setTimeout(() => { btn.dataset.armed = ''; btn.textContent = 'reshelve'; }, 5000);
    return;
  }
  btn.dataset.armed = ''; btn.textContent = 'reshelve';
  await fetch('/api/shelf/reshelve?rebuild=' + rebuild, { method:'POST' });
  say(rebuild ? 'Reorganising the shelf. A few minutes; the shelf updates as it goes.' : 'Shelving the unshelved.');
  loadJobs();
}

/* ── the rack ─────────────────────────────────────────────────────────── */
const rack3d = { ctrl: null, points: {} };
async function loadRack(justInserted) {
  let r;
  try { r = await (await fetch('/api/cartridges')).json(); } catch { return; }
  palette = r.palette || [];
  rackIndex = Object.fromEntries(r.cartridges.map(c => [c.id, c]));
  for (const id of [...cartridges]) if (!rackIndex[id]) cartridges.delete(id);
  if (window.Cartridge3D && r.cartridges.length) {
    $('#rack3d').hidden = false; $('#rack').hidden = true;
    if (!rack3d.ctrl) rack3d.ctrl = window.Cartridge3D.mountRack($('#rack-canvas'), {
      onPick: id => toggleCartridge(id),
      onHover: id => id ? inspectShow(id) : inspectHide(),
      onChange: () => rackUnder(),
    });
    await Promise.all(r.cartridges.map(async c => {
      if (rack3d.points[c.id]) return;
      try { rack3d.points[c.id] = (await (await fetch(`/api/cartridges/${c.id}/constellation`)).json()).points || []; } catch { rack3d.points[c.id] = []; }
    }));
    rack3d.ctrl.setCartridges(r.cartridges.map(c => ({
      id: c.id, design: c.design, colour: c.colour, name: c.name, level: c.level,
      sub: `${c.level} · ${c.document_count} volumes`, points: rack3d.points[c.id], artUrl: `/api/cartridges/${c.id}/art`,
      seated: cartridges.has(c.id),
    })));
    rackUnder();
    const room = roomName();
    $('#rack-note').textContent = room ? `in ${room}'s shelf` : '';
    return;
  }
  $('#rack3d').hidden = true; $('#rack').hidden = false;
  $('#rack').innerHTML = r.cartridges.map(c => `
    <button class="spine ${c.id === justInserted ? 'inserting' : ''}" style="--c:${esc(c.colour)}; --w:${26 + Math.round(Math.min(c.document_count, 80) / 80 * 16)}px" data-level="${c.level}"
            aria-pressed="${cartridges.has(c.id)}" title="${esc(c.name)} · ${c.level} · ${c.document_count} volumes · v${c.version}${c.made_by ? ' · made by ' + esc(c.made_by) : ''}"
            onclick="toggleCartridge('${c.id}')" onmouseenter="inspectShow('${c.id}')" onmouseleave="inspectHide()">
      <span class="eject" onclick="event.stopPropagation(); ejectCartridge('${c.id}', this)" title="Take it off the rack">eject</span>
      <span class="swatch">${c.icon_svg || ''}</span>
      <span class="t">${esc(c.name)}</span>
      <span class="n">${c.document_count}</span>
      <span class="lvl"></span>
    </button>`).join('') + `<button class="slot" onclick="openMake()" title="Make a cartridge from this library">+</button>`;
  const room = roomName();
  $('#rack-note').textContent = room ? `in ${room}'s shelf` : cartridges.size ? `${cartridges.size} rooms` : r.cartridges.length ? '' : 'nothing inserted yet — drop a cartridge, or make one';
}
// Hovering a spine lifts the cartridge up into the reading pane, turning.
const inspect = { ctrl: null, timer: null, id: null };
async function inspectShow(id) {
  clearTimeout(inspect.timer);
  const c = rackIndex[id]; if (!c || !window.Cartridge3D) return;
  inspect.timer = setTimeout(async () => {
    const el = $('#inspect');
    if (!inspect.ctrl) inspect.ctrl = window.Cartridge3D.mount($('#inspect-canvas'));
    const fresh = inspect.id !== id; inspect.id = id;
    $('#inspect-who').textContent = c.name;
    $('#inspect-meta').textContent = `${c.level} · ${c.document_count} volumes · v${c.version}${c.made_by ? ' · made by ' + c.made_by : ''}`;
    let points = [];
    try { points = (await (await fetch(`/api/cartridges/${id}/constellation`)).json()).points || []; } catch {}
    inspect.ctrl.set({ design: c.design || {}, colour: c.colour, name: c.name, level: c.level, sub: `${c.level} · ${c.document_count} volumes`, points, artUrl: `/api/cartridges/${id}/art`, lit: cartridges.has(id), flip: fresh });
    el.dataset.on = 'true';
  }, 140);
}
function inspectHide() {
  clearTimeout(inspect.timer);
  inspect.timer = setTimeout(() => { $('#inspect').dataset.on = 'false'; }, 260);
}

// Under the socket: which cartridge is in view, of how many, and eject.
function rackUnder() {
  const id = rack3d.ctrl?.current(); const c = id && rackIndex[id];
  const n = rack3d.ctrl?.count() || 0;
  const el = $('#rack-under');
  if (!c) { el.innerHTML = ''; return; }
  el.dataset.on = String(cartridges.has(id));
  el.innerHTML = `<span class="nm" onclick="toggleCartridge('${id}')" title="${cartridges.has(id) ? 'Click to lift it out' : 'Click to seat it and ask its shelf'}">${esc(c.name)}</span>
    <span class="cnt">${Object.keys(rackIndex).indexOf(id) + 1}/${n}</span>
    <button class="linkish" style="font-size:10.5px" onclick="ejectCartridge('${id}', this)">eject</button>`;
  for (const a of document.querySelectorAll('.rack3d .arrow')) a.disabled = n < 2;
}
function rackStep(d) { rack3d.ctrl?.step(d); rackUnder(); }
function rackGrid() {
  const g = $('#rackgrid');
  if (!g.hidden) { g.hidden = true; return; }
  g.hidden = false;
  g.innerHTML = Object.values(rackIndex).map(c => `<button data-on="${cartridges.has(c.id)}" style="--c:${esc(c.colour)}" onclick="rack3d.ctrl.show('${c.id}'); rackUnder(); $('#rackgrid').hidden = true" title="${esc(c.name)} · ${c.level} · ${c.document_count}"><i class="dot"></i><span>${esc(c.name)}</span></button>`).join('');
}
function toggleCartridge(id) {
  // One room at a time: seating a cartridge lifts whatever was seated.
  const wasOn = cartridges.has(id);
  for (const other of [...cartridges]) rack3d.ctrl?.seat(other, false);
  cartridges.clear();
  if (!wasOn) cartridges.add(id);
  if (rack3d.ctrl) { rack3d.ctrl.show(id); rack3d.ctrl.seat(id, !wasOn); }
  rackUnder();
  loadRack(); loadShelf(); writeScope();
  $('#entry').placeholder = placeholderFor(view);
  const room = roomName();
  desk(room ? `in ${esc(room)}'s shelf` : cartridges.size ? `across ${cartridges.size} cartridges` : '');

/* ── accession ────────────────────────────────────────────────────────── */
const SUPPORTED = /\.(pdf|md|markdown|txt|text|rst|zip)$/i;

// A dropped folder arrives as a directory entry, not a list of files. Walk it.
async function collect(items) {
  const out = [];
  const walk = entry => new Promise(resolve => {
    if (entry.isFile) {
      entry.file(f => { if (SUPPORTED.test(f.name) && !f.name.startsWith('.')) out.push(f); resolve(); }, resolve);
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      const batch = () => reader.readEntries(async entries => {
        if (!entries.length) return resolve();
        for (const e of entries) await walk(e);
        batch();  // readEntries returns in pages; keep going until empty
      }, resolve);
      batch();
    } else resolve();
  });
  for (const item of items) {
    const entry = item.webkitGetAsEntry?.();
    if (entry) await walk(entry);
    else if (item.getAsFile) { const f = item.getAsFile(); if (f && SUPPORTED.test(f.name)) out.push(f); }
  }
  return out;
}

async function accession(files) {
  files = [...files].filter(f => SUPPORTED.test(f.name));
  if (!files.length) { say('Nothing there the library can read.', true); return; }
  // A zip is a cartridge; it goes on the rack, not the shelf.
  const zips = files.filter(f => /\.zip$/i.test(f.name));
  for (const z of zips) await insertCartridge(z);
  files = files.filter(f => !/\.zip$/i.test(f.name));
  if (!files.length) { loadShelf(); holdings(); loadSubjects(); return; }
  const many = files.length > 1;
  let shelved = 0, dupes = 0, failed = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    say(many ? `Reading ${i + 1} of ${files.length} — ${file.name}` : `Reading ${file.name}…`);
    const fd = new FormData(); fd.append('file', file);
    try {
      const r = await fetch('/api/documents', { method:'POST', body:fd });
      const j = await r.json();
      if (!r.ok) { failed++; if (!many) say(j.detail || 'That file could not be read.', true); continue; }
      if (j.status === 'duplicate') { dupes++; if (!many) say(`${file.name} is already on the shelf.`); }
      else {
        shelved++;
        if (!many) say(`${j.title} — ${j.sections} sections, ${j.chunks} passages, ${j.elapsed_seconds}s`
          + (j.needs_ocr ? ' · little text layer, may need OCR' : ''));
      }
    } catch (e) { failed++; if (!many) say(String(e), true); }
    if (many && i % 5 === 4) { loadShelf(); holdings(); }
  }
  if (many) {
    const parts = [`${shelved} shelved`];
    if (dupes) parts.push(`${dupes} already there`);
    if (failed) parts.push(`${failed} unreadable`);
    say(parts.join(' · ') + '. They are searchable now; reading them takes a few minutes each.', failed > 0 && !shelved);
  }
  loadShelf(); holdings();
}

/* ── the apparatus: resolve [n] into margin notes ─────────────────────── */
// "ColBERT: Efficient and Effective Passage Search via…" → "ColBERT". Papers usually
// name themselves before the colon; when they don't, take the first few words.
function shortTitle(t) {
  const head = t.split(/[:\u2014\u2013]/)[0].trim();
  if (head.length >= 4 && head.length <= 28) return head;
  const words = t.split(/\s+/);
  return words.slice(0, 5).join(' ') + (words.length > 5 ? '…' : '');
}

/* ── markdown ─────────────────────────────────────────────────────────── */
// Small on purpose: what a model and a .md file actually emit. Inline pass escapes HTML
// first, then dresses **bold**, *italic*, `code`, [links](u), and finally the [n]
// citation marks, so a mark is never mistaken for a link.
function inline(s) {
  return esc(s)
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>')
    .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/!\[([^\]]*)\]\([^)]+\)/g, '$1')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, l, u) => `<a href="${u}" target="_blank" rel="noopener">${l}</a>`)
    .replace(/\[([^\]\d][^\]]*)\]\([^)]*\)/g, '$1')   // anchors and relative links: keep the words
    .replace(/\[(\d+(?:,\s*\d+)*)\]/g, (_, nums) => `<span class="mark" data-n="${nums.split(',').map(n => n.trim()).join(' ')}">[${nums}]</span>`);
}
// Returns block-level HTML strings, so the answer renderer can hang its margin notes off
// each block. A fenced code block is one block; a list is one block.
function mdBlocks(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const out = []; let i = 0;
  const para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(' '))}</p>`); para.length = 0; } };
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*```/.test(ln)) {                       // fence
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if (!ln.trim()) { flush(); i++; continue; }
    let m;
    if ((m = ln.match(/^(#{1,6})\s+(.*)$/))) { flush(); const l = Math.min(m[1].length, 4); out.push(`<h${l}>${inline(m[2])}</h${l}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) { flush(); out.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(ln)) {                          // quote
      flush(); const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${mdBlocks(buf.join('\n')).join('')}</blockquote>`); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {  // table
      flush(); const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      out.push(`<table><thead><tr>${head.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
      continue;
    }
    if ((m = ln.match(/^(\s*)([-*+]|\d+[.)])\s+/))) {   // list (with nesting by indent)
      flush();
      const items = [];
      while (i < lines.length && (m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))) {
        const depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2);
        let text = m[3]; i++;
        while (i < lines.length && lines[i].trim() && !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i]) && /^\s+/.test(lines[i])) text += ' ' + lines[i++].trim();
        items.push({ depth, ordered: /\d/.test(m[2]), text });
      }
      const build = (start, depth) => {
        const tag = items[start].ordered ? 'ol' : 'ul'; let h = `<${tag}>`; let k = start;
        while (k < items.length && items[k].depth >= depth) {
          if (items[k].depth === depth) { h += `<li>${inline(items[k].text)}`; k++;
            if (k < items.length && items[k].depth > depth) { const [sub, next] = build(k, items[k].depth); h += sub; k = next; }
            h += '</li>';
          } else k++;
        }
        return [h + `</${tag}>`, k];
      };
      out.push(build(0, items[0].depth)[0]); continue;
    }
    para.push(ln.trim()); i++;
  }
  flush();
  return out;
}
function md(text) { return `<div class="md">${mdBlocks(text).join('')}</div>`; }
// A snippet, not a document: markdown syntax out, words kept.
function plain(s) {
  return String(s || '')
    .replace(/```[a-z]*\n?/g, ' ').replace(/^#{1,6}\s+/gm, '').replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[*_`>|]+/g, ' ').replace(/-{3,}/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function markup(text) {
  return esc(text).replace(/\[(\d+(?:,\s*\d+)*)\]/g, (_, nums) => {
    const ns = nums.split(',').map(n => n.trim());
    return `<span class="mark" data-n="${ns.join(' ')}">[${nums}]</span>`;
  });
}

function renderAnswer(el, text) {
  // One markdown block per row of the apparatus grid: the notes for a block sit beside it.
  const blocks = mdBlocks(text);
  el.classList.add('md');
  el.innerHTML = blocks.map(html => {
    const used = [...html.matchAll(/class="mark" data-n="([\d ]+)"/g)]
      .flatMap(m => m[1].split(' ').map(n => parseInt(n)));
    const uniq = [...new Set(used)];
    const notes = uniq.map(n => {
      const s = sources.find(x => x.n === n);
      if (!s) return '';
      const short = shortTitle(s.title);
      const where = (s.section || '').split(' › ').slice(1).join(' › ');
      const c = s.cartridge;
      // A note from a cartridge wears its colour beside the rubric; a reading-only
      // source says so, since what it cites is their reading, not the page.
      const who = c ? `<span class="who">${esc(c.name)}${s.readings_only ? "'s reading" : ''}</span>` : '';
      return `<span class="note ${c ? 'from' : ''}" data-n="${n}" ${c ? `style="--c:${esc(c.colour)}"` : ''}>${who}<b>${esc(short)}</b>${
        s.page ? `<span class="pg">p.${s.page}</span>` : ''}${where ? ` · ${esc(where.slice(0,40))}` : ''}</span>`;
    }).join('');
    return `${html}<div class="apparatus">${notes}</div>`;
  }).join('');

  // Hovering a marker lights its note, and vice versa.
  const link = (a, b, on) => { for (const x of el.querySelectorAll(b)) x.classList.toggle('lit', on); };
  for (const m of el.querySelectorAll('.mark')) {
    const ns = m.dataset.n.split(' ');
    m.onmouseenter = () => ns.forEach(n => link(m, `.note[data-n="${n}"]`, true));
    m.onmouseleave = () => ns.forEach(n => link(m, `.note[data-n="${n}"]`, false));
  }
  for (const nt of el.querySelectorAll('.note')) {
    const n = nt.dataset.n;
    nt.onmouseenter = () => link(nt, `.mark[data-n~="${n}"]`, true);
    nt.onmouseleave = () => link(nt, `.mark[data-n~="${n}"]`, false);
  }
}

/* ── ask ──────────────────────────────────────────────────────────────── */
async function ask(text) {
  if (busy) return;
  busy = true;
  $('#history').hidden = true;
  if (!convId) $('#conv-title').textContent = text.slice(0, 90);
  const intro = $('#view-ask .empty'); if (intro) intro.remove();
  const wrap = document.createElement('div');
  wrap.className = 'turn';
  if (stance) wrap.dataset.stance = stance;
  const label = stance ? (stanceMeta.find(s => s.id === stance)?.label || stance) : '';
  wrap.innerHTML = `${stance ? `<div class="stanced">${esc(label)}</div>` : ''}<div class="asked">${esc(text)}</div><div class="said"><p></p></div>`;
  $('#view-ask').appendChild(wrap);
  const asked = wrap.querySelector('.asked');
  const said = wrap.querySelector('.said');
  wrap.scrollIntoView({ block:'start', behavior:'smooth' });
  desk('<span class="working">consulting the shelf</span>');
  sources = [];
  web.scan(true);

  const body = { message:text, conversational:$('#multi').checked, model:$('#model').value,
                 conversation_id:convId, category_ids:subjects.size ? [...subjects] : null,
                 cartridge_ids:cartridges.size ? [...cartridges] : null, stance, effort: $('#effort').value };
  let answer = '', ev = null, buf = '', thought = '';
  try {
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('event:')) { ev = line.slice(6).trim(); continue; }
        if (!line.startsWith('data:')) continue;
        // Token payloads carry meaningful leading spaces; only trim structured events.
        const rawFull = line.slice(5).replace(/^ /, '').replace(/\r$/, '');
        const raw = (ev === 'token' || ev === 'thinking') ? rawFull : rawFull.trim();
        if (ev === 'conversation') convId = JSON.parse(raw).conversation_id;
        else if (ev === 'meta') {
          const m = JSON.parse(raw);
          if (m.rewritten) asked.insertAdjacentHTML('beforeend',
            `<span class="rewrote">looked for: ${esc(m.rewritten)}</span>`);
          if (m.searches) asked.insertAdjacentHTML('beforeend',
            `<span class="rewrote">deep · searched: ${m.searches.map(esc).join(' · ')}</span>`);
          desk('<span class="working">thinking</span>');
          if (m.retrieving) web.scan(true);
        }
        else if (ev === 'sources') {
          sources = JSON.parse(raw);
          web.scan(false); web.light([...new Set(sources.map(s => s.document_id))]);
          desk(`<span class="working">${sources.length} passages in hand</span>`);
        }
        else if (ev === 'thinking') {
          if (!thought) murmur.start(asked);
          thought += raw;
          murmur.add(raw);
          desk(`<span class="working">considering</span>`);
        }
        else if (ev === 'token') {
          if (thought && answer === '') murmur.stop();
          answer += raw;
          said.classList.add('md');
          said.innerHTML = mdBlocks(answer).join('');
          if (thought) desk('');
        }
        else if (ev === 'done') {
          murmur.stop();
          const d = JSON.parse(raw);
          renderAnswer(said, d.answer);
          const cited = (d.cited || []).length;
          if (!cited && sources.length) said.insertAdjacentHTML('beforeend',
            `<div class="unsourced">answered without drawing on the shelf</div>`);
          desk(d.markers_emitted
            ? `${d.markers_resolved} of ${d.markers_emitted} citations verified against the shelf`
            : '');
        }
        else if (ev === 'error') {
          murmur.stop(); web.scan(false);
          said.innerHTML = `<p style="color:var(--amber)">${esc(raw)}</p>`;
          desk('');
        }
      }
    }
  } catch (e) {
    murmur.stop(); web.scan(false);
    said.innerHTML = `<p style="color:var(--amber)">${esc(String(e))}</p>`;
    desk('');
  }
  busy = false;
}

/* ── conversations ────────────────────────────────────────────────────── */
const INVITATION = `<div class="empty invitation"><b>Ask the library something.</b>
<span>It answers from what it has read, and marks in the margin exactly which page each claim
came from. Anything unmarked is its own reasoning.</span></div>`;

async function toggleHistory() {

  h.hidden = false;

  h.innerHTML = convs.length ? convs.map(c => `
    <div class="row" data-current="${c.id === convId}" onclick="openChat('${c.id}')">

function shortModel(m) { return (m || '').split('/').pop().split(':')[0]; }
async function openChat(id) {
  if (busy) return;
  let msgs;
  try { msgs = await (await fetch('/api/conversations/' + id)).json(); } catch { return; }
  convId = id;
  $('#history').hidden = true;
  const view = $('#view-ask');
  view.innerHTML = '';
  let asked = null;
  for (const m of msgs) {

/* ── highlighter ──────────────────────────────────────────────────────── */
const STOP = new Set('a an the and or of to in on for with by is are was were be as at from that this it its into how what why when which does do did not vs versus than'.split(' '));
// The words worth lighting: three letters or more, not glue.
function terms(q) { return [...new Set((q || '').toLowerCase().match(/[\p{L}\p{N}][\p{L}\p{N}'-]{2,}/gu) || [])].filter(w => !STOP.has(w)); }
// Light the terms in already-escaped HTML text: word-start prefix match, so "inject"
// lights "injection". Pass `lift` to wrap that exact sentence as well.
function hl(html, words, lift) {
  if (lift) {
    const l = esc(lift.trim());
    const at = html.indexOf(l);
    if (at >= 0) html = html.slice(0, at) + '<span class="lift">' + l + '</span>' + html.slice(at + l.length);
  }
  if (!words.length) return html;
  const re = new RegExp('(?<![\\p{L}\\p{N}])(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')[\\p{L}\\p{N}]*', 'giu');
  // Never touch inside a tag.
  return html.split(/(<[^>]+>)/).map(part => part.startsWith('<') ? part : part.replace(re, '<mark class="hl">$&</mark>')).join('');
}

// The excerpt is clamped to a few lines, so the sentence nearest the question leads it
// when it would otherwise be cut off; the passage's own opening follows.
function excerpt(text, lift) {
  if (!lift) return text;
  const at = text.indexOf(lift.trim());
  if (at < 0 || at < 120) return text;
  return lift.trim() + ' … ' + text.slice(0, at).trim();
}

let threadsData = null, threadsFilter = '', allConflicts = false;
const CONFLICTS_SHOWN = 5;
async function loadThreads() {

function threadLight(ids) { web.light(ids); }

function renderThreads() {

  $('#tcount').textContent = `${shownThemes.length} threads ${where}${shownConf.length ? ` · ${shownConf.length} where sources disagree` : ''}`;

    h += confList.map(c => {
      const theme = themes.find(t => t.id === c.cluster_id);
      const dids = theme ? docIds(theme) : '[]';
      let body;

        // The words the two claims share are the pivot the disagreement turns on.

        const shared = a.filter(w => b.has(w));
        body = `<div class="pair">${c.pair.map(p => `<blockquote><cite>${esc(p.source || 'one source')}</cite>${hl(esc(p.claim), [...shared, ...fwords])}</blockquote>`).join('')}</div>

      } else {
        body = `<p class="why">${hl(esc(c.explanation), fwords)}</p>`;
      }

        <div class="conflict-h"><span class="theme-t">${hl(esc(c.label), fwords)}</span><span class="flag">conflict</span><span class="theme-n">${(c.sources || []).length} volume${(c.sources || []).length === 1 ? '' : 's'}</span></div>

  const rest = shownThemes.filter(t => t.document_count < 4);
  const card = t => `<div class="theme big" onmouseenter='threadLight(${docIds(t)})' onclick='this.classList.toggle("open"); threadDive(${docIds(t)})'>
      <div class="theme-h">
        <span class="theme-t">${hl(esc(t.label || 'unnamed'), fwords)}</span>
        <span class="theme-n">${t.document_count} volumes · ${t.size} claims</span>

      <div class="theme-s">${hl(esc(t.summary || ''), fwords)}</div>
      <div class="spans">${t.documents.map(d => `<span class="span">${esc(d.slice(0, 40))}</span>`).join('')}</div>
    </div>`;
  const line = t => `<details class="theme small" onmouseenter='threadLight(${docIds(t)})'>
      <summary><span class="theme-t">${hl(esc(t.label || 'unnamed'), fwords)}</span>${t.has_contradiction ? '<span class="flag">conflict</span>' : ''}<span class="theme-n">${t.document_count} volume${t.document_count === 1 ? '' : 's'}</span></summary>
      <div class="theme-s">${hl(esc(t.summary || ''), fwords)}</div>

}

    const reader = res.body.getReader(), dec = new TextDecoder();

            `<div><b>[${r.n}]</b>${esc(r.title)}${r.page ? `, p.${r.page}` : ''}${r.section ? ' — ' + esc((r.section || '').split(' › ').slice(1).join(' › ')) : ''}${r.cartridge ? ' (' + esc(r.cartridge.name) + ')' : ''}</div>`).join('')}</div>

  } catch (e) { el.innerHTML = `<div class="empty">${esc(String(e))}</div>`; return; }
  const kv = rows => `<table class="kv">${rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.value ?? '—')}</td><td>${r.note ? esc(r.note) + ' · ' : ''}<code>${esc(r.env)}</code></td></tr>`).join('')}</table>`;
  const sv = s.services;
  el.innerHTML = `<div class="settings">
    <h2>Settings</h2>
    <div class="sect">
      <p class="label">Services</p>
      <div class="svc">
        <span data-ok="${sv.postgres}">Postgres</span>
        <span data-ok="${sv.redis}">Redis</span>
        <span data-ok="${sv.ollama}">Ollama · ${esc(sv.ollama_url)}${sv.ollama && sv.resident_models.length ? ' · resident: ' + sv.resident_models.map(esc).join(', ') : ''}</span>
        <span data-ok="${sv.model_answering}" title="${esc(sv.model_liveness?.detail || '')}">Model answering${sv.model_liveness?.latency != null ? ' · probe ' + sv.model_liveness.latency + 's' : ''}${sv.model_liveness?.checked_seconds_ago != null ? ' · checked ' + sv.model_liveness.checked_seconds_ago + 's ago' : ''}${sv.generations ? ' · ' + sv.generations.in_flight + ' in flight' : ''}</span>
        <span data-ok="${sv.reranker}">Reranker (local)</span>
      </div>
    </div>
    <div class="sect"><p class="label">Models</p>${kv(s.models)}</div>
    <div class="sect"><p class="label">Retrieval</p>${kv(s.retrieval)}</div>
    <div class="sect"><p class="label">Library</p>${kv(s.library)}
      <p class="empty" style="padding:8px 0 0">Configuration is read from the environment (or <code>.env</code>): set the variable shown and <code>./library restart</code>.</p></div>
    <div class="sect">
      <p class="label">Storage &amp; maintenance</p>
      <table class="kv">
        <tr><td>Store</td><td>${esc(s.storage.store)}</td><td></td></tr>
        <tr><td>Database</td><td>${esc(s.storage.database)}</td><td></td></tr>
        <tr><td>Orphans</td><td>${Object.values(s.storage.orphans).reduce((a,b)=>a+b,0)}</td><td>${esc(JSON.stringify(s.storage.orphans))}</td></tr>
      </table>
      <div class="acts" style="margin-top:10px">
        <button class="linkish" onclick="gc(this)">collect garbage</button>
        <button class="linkish" onclick="rebuild()">rebuild threads</button>
        <button class="linkish" onclick="reshelve(this)">reshelve</button>
        <button class="linkish" onclick="fetch('/api/settings/incidents/test',{method:'POST'}).then(loadSettings)">record a test incident</button>
      </div>
    </div>
    <div class="sect">
      <div class="shelf-h" style="padding:0 0 8px"><p class="label" style="margin:0">Incidents</p>
        <button class="linkish" style="margin-left:auto" onclick="showResolved=!showResolved; loadSettings()">${showResolved ? 'hide resolved' : 'show resolved'}</button></div>
      <div id="incidents">${inc.length ? inc.map(incidentHtml).join('') : '<div class="empty"><b>Nothing has gone wrong.</b>Errors from the API, the worker, reading jobs and chat turns collect here, and the library can be asked to troubleshoot them against its own documentation.</div>'}</div>
    </div>
  </div>`;
  $('#inc-badge').hidden = !s.incidents_open; $('#inc-badge').textContent = s.incidents_open;
}
function incidentHtml(i) {
  return `<div class="incident" data-resolved="${i.resolved}" id="inc-${i.id}">
    <div class="inc-h">
      <span class="inc-kind">${esc(i.kind)}</span>
      <span class="inc-src">${esc(i.source)}</span>
      ${i.count > 1 ? `<span class="inc-n">× ${i.count}</span>` : ''}
      <span class="inc-t" title="${esc(i.first_at)}">${fmtWhen(i.last_at)}</span>
    </div>
    <div class="inc-msg">${esc(i.message)}</div>
    <div class="inc-acts">
      <button class="linkish" onclick="advise('${i.id}', this)">${i.advice ? 'troubleshoot again' : 'troubleshoot'}</button>
      ${i.detail ? `<button class="linkish" onclick="const d=this.closest('.incident').querySelector('.inc-detail'); d.hidden=!d.hidden">traceback</button>` : ''}
      <button class="linkish" onclick="resolveIncident('${i.id}', ${!i.resolved})">${i.resolved ? 'reopen' : 'resolved'}</button>
    </div>
    ${i.detail ? `<div class="inc-detail" hidden><pre>${esc(i.detail)}</pre></div>` : ''}
    <div class="advice-slot">${i.advice ? adviceHtml(i.advice, i.advice_at) : ''}</div>
  </div>`;
}
function adviceHtml(a, at) {
  const steps = (a.steps || []).map((s, n) => `<div class="step">
      <span class="n">${n + 1}</span><b>${esc(s.title)}</b>
      ${s.command ? `<div class="cmd" data-doc="${s.documented !== false}"><code>${esc(s.command)}</code>${s.documented === false ? '<span class="undoc" title="This command or flag does not appear in the library\'s documentation; the model may have invented it.">not in our docs</span>' : ''}<button class="linkish" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('code').textContent); this.textContent='copied'; setTimeout(()=>this.textContent='copy',1500)">copy</button></div>` : ''}
      ${s.why ? `<div class="why">${esc(s.why)}</div>` : ''}
    </div>`).join('');
  const issue = a.open_issue ? `<div class="issue">
      <a href="${esc(a.issue_url)}" target="_blank" rel="noopener">Open an issue on GitHub — ${esc(a.issue_title || '')}</a>
      <span class="inc-n"> · pre-filled; review before submitting</span>
      <pre>${esc(a.issue_body || '')}</pre>
    </div>` : '';
  return `<div class="advice">
    <div class="cause" data-c="${esc(a.likely_cause)}">${esc(a.likely_cause)} · ${esc(a.model || '')}${at ? ' · ' + fmtWhen(at) : ''}</div>
    <div class="diag md">${mdBlocks(a.diagnosis || '').join('')}</div>
    ${steps}
    ${a.docs_used?.length ? `<div class="refs">from: ${a.docs_used.map(esc).join(' · ')}</div>` : ''}
    ${issue}
    <div class="refs">These are suggestions to run yourself; the library does not run them.</div>
  </div>`;
}
async function advise(id, btn) {
  btn.disabled = true; btn.textContent = 'consulting the documentation…';
  const slot = document.querySelector(`#inc-${id} .advice-slot`);
  try {
    const r = await fetch(`/api/settings/incidents/${id}/advise`, { method:'POST' });
    const j = await r.json();
    if (!r.ok) { slot.innerHTML = `<div class="advice"><div class="diag" style="color:var(--amber)">${esc(j.detail || 'The model could not advise.')}</div></div>`; return; }
    slot.innerHTML = adviceHtml(j, new Date().toISOString());
  } catch (e) { slot.innerHTML = `<div class="advice"><div class="diag" style="color:var(--amber)">${esc(String(e))}</div></div>`; }
  finally { btn.disabled = false; btn.textContent = 'troubleshoot again'; }
}
async function resolveIncident(id, resolved) {
  await fetch(`/api/settings/incidents/${id}/resolve?resolved=${resolved}`, { method:'POST' });
  loadSettings();
}
async function gc(btn) {
  btn.textContent = 'collecting…';
  const j = await (await fetch('/api/settings/gc', { method:'POST' })).json();
  say(`Collected: ${j.vectors_removed} orphaned vectors, ${j.files_removed} stray files.`);
  holdings(); loadSettings();
}
async function incidentBadge() {
  try { const s = await (await fetch('/api/settings/incidents')).json();
    $('#inc-badge').hidden = !s.length; $('#inc-badge').textContent = s.length; } catch {}
}

/* ── make a cartridge ─────────────────────────────────────────────────── */
const GLYPHS = {
  book:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>',
  flask:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/></svg>',
  graph:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="18" r="2"/><circle cx="12" cy="7" r="2"/><circle cx="18" cy="15" r="2"/><path d="M7.5 16.5L11 9M13.5 8.5l3 5"/></svg>',
  gear:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  leaf:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19l8-8"/></svg>',
};
const make = { name:'', colour:null, glyph:'book', level:'readings', timer:null,
  design: { material:'clear', tint:.55, opacity:.35, sparkle:.5, roughness:.25, art:'generated', clearance:'open' }, artUrl:null, artData:null, points:[], stage:null };
const CLEARANCES = [['open','Open','travels freely'],['internal','Internal','for your own people'],['confidential','Confidential','handle with care'],['restricted','Restricted','a receiving library will not re-export its volumes']];
const MATERIALS = [['solid','Solid'],['clear','Clear'],['smoke','Smoke'],['glitter','Glitter'],['metallic','Metallic']];
function openMake() { $('#tab-make').hidden = false; setView('make'); }
function renderMake(flip) {
  const el = $('#view-make');
  if (!palette.length) palette = ['#2f6f8f','#7a5c2e','#4f7a3a','#8a3d5e','#3e6b6b','#9a6b1f','#5a4b8a','#6f6f6f'];
  make.colour ||= palette[Object.keys(rackIndex).length % palette.length];
  const scope = [];
  if (subjects.size) scope.push(`${subjects.size} subject${subjects.size > 1 ? 's' : ''}`);
  if (cartridges.size) scope.push([...cartridges].map(id => rackIndex[id]?.name).filter(Boolean).join(', '));
  el.innerHTML = `<div class="make">
    <h2>Make a cartridge</h2>
    <p class="why">A cartridge is a slice of this library another one can put on its rack. The level sets what leaves: the volumes themselves, only what this library understood of them, or just the fact that they exist.</p>
    <div class="row"><label>Name</label><input type="text" id="mk-name" value="${esc(make.name)}" placeholder="Security's shelf" oninput="make.name=this.value; previewMake()"/></div>
    <div class="row"><label>Colour</label><div class="swatches">${palette.map(c =>
      `<button style="--c:${c}" aria-pressed="${c === make.colour}" title="${c}" onclick="make.colour='${c}'; renderMake()"></button>`).join('')}</div></div>
    <div class="row"><label>Icon</label><div class="glyphs">${Object.entries(GLYPHS).map(([k, svg]) =>
      `<button aria-pressed="${k === make.glyph}" title="${k}" onclick="make.glyph='${k}'; renderMake()">${svg}</button>`).join('')}</div></div>
    <div class="row"><label>Material</label><div><div class="mats">${MATERIALS.map(([v, l]) =>
      `<button aria-pressed="${make.design.material === v}" onclick="make.design.material='${v}'; renderMake(true)">${l}</button>`).join('')}</div>
      <div class="dials">
        ${[['tint','Tint'],['opacity','Opacity'],['sparkle','Sparkle'],['roughness','Roughness']].map(([k, l]) => `<label class="dial"><span>${l}</span>
          <input type="range" min="0" max="1" step=".01" value="${make.design[k]}" oninput="make.design.${k}=+this.value; this.nextElementSibling.value=Math.round(this.value*100); stageUpdate()"/><output>${Math.round(make.design[k]*100)}</output></label>`).join('')}
      </div>
      <div class="locked">The design is sealed into the cartridge: it looks like this on every rack.</div></div></div>
    <div class="row"><label>Clearance</label><div><div class="mats">${CLEARANCES.map(([v, l, d]) =>
      `<button aria-pressed="${make.design.clearance === v}" title="${d}" onclick="make.design.clearance='${v}'; renderMake(true)">${l}</button>`).join('')}</div>
      <div class="locked">${esc(CLEARANCES.find(x => x[0] === make.design.clearance)?.[2] || '')}. Printed on the label; sealed with the design.</div></div></div>
    <div class="row"><label>Art</label><div class="artpick">
      ${make.artUrl ? `<img src="${make.artUrl}" alt=""/>` : ''}
      <span>${make.design.art === 'upload' ? 'your image' : 'its own constellation, drawn from the volumes'}</span>
      <button class="linkish" onclick="$('#mk-art').click()">upload an image</button>
      ${make.design.art === 'upload' ? `<button class="linkish" onclick="make.design.art='generated'; make.artData=null; renderMake(true)">use the constellation</button>` : ''}
      <input type="file" id="mk-art" accept="image/*" hidden onchange="pickArt(this.files[0])"/>
    </div></div>
    <div class="row"><label>Level</label><div class="levels">
      ${[['full','Full','The originals, every passage, and every reading. The receiver can open the pages.'],
         ['readings','Readings','What this library wrote about each section, and its margin notes. Searchable and citable; the text itself never leaves.'],
         ['catalogue','Catalogue','A summary and subjects per volume. Enough to know the material exists and ask for it.']].map(([v, l, d]) =>
        `<label><input type="radio" name="mk-level" value="${v}" ${v === make.level ? 'checked' : ''} onchange="make.level='${v}'; previewMake(); stageUpdate()"/><span>${l}<small>${d}</small></span></label>`).join('')}
    </div></div>
    <div class="row"><label>Contents</label><div style="font:13px/1.5 var(--serif); color:var(--dim)">${
      scope.length ? `What is scoped now — ${esc(scope.join(' · '))}. Change the scope with the subject chips and the rack.` : 'Nothing is scoped, so the whole library goes in. Pick subjects or a cartridge to narrow it.'}</div></div>
    <div class="preview" id="mk-preview">…</div>
    <button class="go" id="mk-go" onclick="exportCartridge()" ${make.name.trim() ? '' : 'disabled'}>make it</button>
  </div>`;
  previewMake();
  stageShow();
  if (flip) stageUpdate(true);
}
// The object in the right-hand space, turning as the dials move.
async function stageShow() {
  const st = $('#mk-stage'); st.hidden = false;
  if (!window.Cartridge3D) return;
  if (!make.stage) make.stage = window.Cartridge3D.mount($('#mk-canvas'));
  stageUpdate(true);
  // art + constellation for the current selection
  const sel = makeSelection();
  const body = JSON.stringify(sel.category_ids.length || sel.cartridge_ids.length ? sel : { ...sel, document_ids: await allDocumentIds() });
  try {
    const pts = (await (await fetch(`/api/cartridges/art/preview?points=1`, { method:'POST', headers:{'Content-Type':'application/json'}, body })).json()).points || [];
    make.points = pts;
    if (make.design.art !== 'upload') {
      const blob = await (await fetch(`/api/cartridges/art/preview?colour=${encodeURIComponent(make.colour)}`, { method:'POST', headers:{'Content-Type':'application/json'}, body })).blob();
      if (make.artUrl && make.artUrl.startsWith('blob:')) URL.revokeObjectURL(make.artUrl);
      make.artUrl = URL.createObjectURL(blob);
    }
    stageUpdate();
  } catch {}
}
function stageUpdate(flip) {
  if (!make.stage) return;
  make.stage.set({ design: { ...make.design }, colour: make.colour, name: make.name.trim() || 'Cartridge', level: make.level, sub: `${make.level} · ${(make.points || []).length} volumes`, points: make.points, artUrl: make.artUrl, lit: true, flip: !!flip });
}
function pickArt(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { make.artData = rd.result; make.artUrl = rd.result; make.design.art = 'upload'; renderMake(true); };
  rd.readAsDataURL(file);
}
function makeSelection() {
  return { category_ids:[...subjects], cartridge_ids:[...cartridges], document_ids:[], level:make.level };
}
function previewMake() {
  $('#mk-go').disabled = !make.name.trim();
  clearTimeout(make.timer);
  make.timer = setTimeout(async () => {
    const sel = makeSelection();
    let r;
    try {
      r = await (await fetch('/api/cartridges/preview', { method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(sel.category_ids.length || sel.cartridge_ids.length ? sel : { ...sel, document_ids: await allDocumentIds() }) })).json();
    } catch { return; }
    const c = r.counts || {};
    const mb = ((r.estimated_bytes || 0) / 1e6).toFixed(1);
    $('#mk-preview').innerHTML = `<b>${c.documents || 0} volumes</b> · ${c.chunks || 0} passages · ${c.artifacts || 0} readings · ${c.vectors || 0} vectors${c.originals ? ` · ${c.originals} originals` : ''} · about ${mb} MB<br>`
      + (r.titles || []).slice(0, 8).map(esc).join(' · ') + ((r.titles || []).length > 8 ? ' …' : '');
  }, 250);
}
async function allDocumentIds() {
  const docs = await (await fetch('/api/documents')).json();
  return docs.map(d => d.id);
}
async function exportCartridge() {
  const sel = makeSelection();
  if (!sel.category_ids.length && !sel.cartridge_ids.length) sel.document_ids = await allDocumentIds();
  const body = { ...sel, name:make.name.trim(), colour:make.colour, icon_svg:GLYPHS[make.glyph], design:make.design, art: make.design.art === 'upload' ? make.artData : null };
  $('#mk-go').disabled = true; $('#mk-go').textContent = 'making…';
  try {
    const r = await fetch('/api/cartridges/export', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!r.ok) { say((await r.json()).detail || 'Could not make it.', true); return; }
    const blob = await r.blob();
    const name = (r.headers.get('content-disposition') || '').match(/filename="?([^";]+)/)?.[1] || 'cartridge.zip';
    const a = Object.assign(document.createElement('a'), { href:URL.createObjectURL(blob), download:name });
    a.click(); URL.revokeObjectURL(a.href);
    say(`${make.name} is made — ${name}.`);
  } finally { $('#mk-go').disabled = false; $('#mk-go').textContent = 'make it'; }
}

/* ── composer ─────────────────────────────────────────────────────────── */
$('#composer').onsubmit = e => {
  e.preventDefault();
  const v = $('#entry').value.trim();
  if (v.length < 2) return;
  if (view === 'ask') { $('#entry').value = ''; ask(v); }
  else runFind(v);
};
$('#entry').oninput = e => {
  if (view !== 'find') return;
  clearTimeout(findTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { $('#view-find').innerHTML = ''; web.focus(null); web.hover(null); return; }
  findTimer = setTimeout(() => runFind(q), 220);
};

async function loadModels() {
  const m = await (await fetch('/api/chat/models')).json();
  thinkingModels = m.thinking || {};
  stanceMeta = m.stances || [];
  $('#model').innerHTML = Object.entries(m.options)
    .map(([k,v]) => `<option value="${v}" ${v === m.default ? 'selected' : ''}>${k}</option>`).join('');
  renderStanceMenu();
}

function renderStanceMenu() {
  const byId = Object.fromEntries(stanceMeta.map(s => [s.id, s]));
  const done = new Set();
  let h = '<p>How the librarian reads</p>';
  for (const s of stanceMeta) {
    if (done.has(s.id)) continue;
    const opt = x => `<button class="stance-opt" role="menuitemradio" aria-pressed="${stance === x.id}" onclick="setStance('${x.id}')">${esc(x.label)}</button>`;
    if (s.counterpart && byId[s.counterpart]) {
      h += `<div class="stance-pair">${opt(s)}<span class="vs">·</span>${opt(byId[s.counterpart])}</div>`;
      done.add(s.id); done.add(s.counterpart);
    } else { h += opt(s); done.add(s.id); }
  }
  h += `<button class="stance-opt" role="menuitemradio" aria-pressed="${stance === null}" onclick="setStance(null)">none <small>the librarian's default reserve</small></button>`;
  $('#stance-menu').innerHTML = h;
  const b = $('#stance-btn');
  b.dataset.on = String(!!stance);
  b.textContent = stance ? byId[stance]?.label || stance : 'stance';
}
function toggleStanceMenu(force) {
  const m = $('#stance-menu'), open = force ?? m.dataset.open !== 'true';
  m.dataset.open = String(open);
  $('#stance-btn').setAttribute('aria-expanded', String(open));
}
function setStance(id) { stance = id; renderStanceMenu(); toggleStanceMenu(false); }
document.addEventListener('click', e => { if (!e.target.closest('.stance')) toggleStanceMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleStanceMenu(false); });

$('#view-ask').innerHTML = INVITATION;

$('#effort').value = localStorage.getItem('effort') || 'normal';
$('#effort').onchange = () => localStorage.setItem('effort', $('#effort').value);
setView('ask'); loadModels(); holdings(); loadRack().then(loadShelf); loadSubjects(); loadJobs();
web.init();
setInterval(loadJobs, 4000);
incidentBadge();
setInterval(() => { holdings(); incidentBadge(); }, 30000);
</script>

  // The cartridge as an object. Loaded as a module (it imports three.js); if WebGL is

  try { const m = await import('/cartridge3d.js'); window.Cartridge3D = m; loadRack(); } catch (e) { console.warn('3D cartridges unavailable', e); }
