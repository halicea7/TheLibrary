<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Library</title>
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Rubrication. Manuscripts used red ink for annotation and nothing else.
   Three accents, one meaning each, and they never trade places:
     rubric    a claim traced back to your shelf — the citation apparatus, nothing else
     verdigris system and structural state — reading progress, selection, focus
     amber     wants your attention — paused work, duplicates, sources that disagree
     violet    the librarian speaking for itself — an answer given under a stance
   Everything else is ink and paper. The discipline is the point: a flash of red
   always means provenance, so you can trust it at a glance.
   ────────────────────────────────────────────────────────────────────────── */
:root {
  --bg:#0a0b0d; --panel:#0f1013; --sunk:#050607;
  --rule:#202226; --rule-soft:#17191c;
  --fg:#dedcd6; --dim:#8b8a85; --faint:#5c5b57;
  --rubric:#cc5f46; --verdigris:#4f9186; --amber:#b8894f; --opinion:#a98ae0;
  --gilt:#b8964e; --gilt-hi:#e2c47a; --gilt-lo:#7d6330;
  --ink:'221,226,234';
  --serif:'Iowan Old Style','Charter','Hoefler Text',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
/* The day room: papyrus and ink, bronze gone green, gilt on the edges. The night room
   below keeps its slate. The pigments keep their meanings in both -- rubric is still
   "from the shelf", verdigris still "system", amber still "attention"; gilt is chrome
   (rules, the lintel, the chosen tab) and never a signal. */
@media (prefers-color-scheme: light) {
  :root {
    --bg:#ece4d3; --panel:#f3ecdd; --sunk:#e2d8c4;
    --rule:#cdbfa3; --rule-soft:#ddd2bb;
    --fg:#2a2118; --dim:#6a5943; --faint:#9a8a70;
    --rubric:#a3432a; --verdigris:#3d7a69; --amber:#9a6b1f; --opinion:#3b5aa6;
    --gilt:#a8843a; --gilt-hi:#d9b86a; --gilt-lo:#7a5c22;
    --ink:'42,33,24';
  }
}
:root[data-theme=light] {
  --bg:#ece4d3; --panel:#f3ecdd; --sunk:#e2d8c4;
  --rule:#cdbfa3; --rule-soft:#ddd2bb;
  --fg:#2a2118; --dim:#6a5943; --faint:#9a8a70;
  --rubric:#a3432a; --verdigris:#3d7a69; --amber:#9a6b1f; --opinion:#3b5aa6;
  --gilt:#a8843a; --gilt-hi:#d9b86a; --gilt-lo:#7a5c22;
  --ink:'42,33,24';
}
:root[data-theme=dark] {
  --bg:#0a0b0d; --panel:#0f1013; --sunk:#050607;
  --rule:#202226; --rule-soft:#17191c;
  --fg:#dedcd6; --dim:#8b8a85; --faint:#5c5b57;
  --rubric:#cc5f46; --verdigris:#4f9186; --amber:#b8894f; --opinion:#a98ae0;
  --gilt:#b8964e; --gilt-hi:#e2c47a; --gilt-lo:#7d6330;
  --ink:'221,226,234';
}

* { box-sizing:border-box; }
[hidden] { display:none !important; }  /* the attribute wins over any display: on a class */
html,body { height:100%; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased;
  display:grid; grid-template-rows:auto 1fr;
}
:focus-visible { outline:2px solid var(--verdigris); outline-offset:2px; border-radius:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ── masthead ─────────────────────────────────────────────────────────── */
.masthead {
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; position:relative;
  padding:14px 22px; border-bottom:1px solid var(--rule); background:var(--panel);
}
/* The lintel: a gilt fillet along the bottom edge, with the room's rule beneath it. */
.masthead::after { content:''; position:absolute; left:0; right:0; bottom:2px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gilt) 12%, var(--gilt-hi) 50%, var(--gilt) 88%, transparent); opacity:.85; }
.wordmark {
  font:600 15px/1 var(--serif); letter-spacing:.2em; text-transform:uppercase; margin:0;
}
.wordmark b { color:var(--fg); font-weight:700; }
.holdings { font:11.5px/1 var(--mono); color:var(--faint); letter-spacing:.02em; }
.holdings .sep { opacity:.4; padding:0 6px; }
.masthead .right { margin-left:auto; display:flex; align-items:center; gap:10px; }

/* ── frame ────────────────────────────────────────────────────────────── */
.frame { display:grid; grid-template-columns:270px minmax(0,1fr); min-height:0; }
@media (max-width:920px) { .frame { grid-template-columns:1fr; } }

.shelf {
  position:relative;
  border-right:1px solid var(--rule); background:var(--panel);
  padding:16px 16px 22px; overflow-y:auto; min-height:0;
  scrollbar-width:thin; scrollbar-color:var(--rule) transparent;
}
.shelf::-webkit-scrollbar { width:6px; }
.shelf::-webkit-scrollbar-thumb { background:var(--rule); border-radius:3px; }
.shelf::-webkit-scrollbar-track { background:transparent; }
.pane { scrollbar-width:thin; scrollbar-color:var(--rule) transparent; }
.pane::-webkit-scrollbar { width:6px; }
.pane::-webkit-scrollbar-thumb { background:var(--rule); border-radius:3px; }
@media (max-width:920px) { .shelf { border-right:0; border-bottom:1px solid var(--rule); max-height:42vh; } }

.reading { display:grid; grid-template-rows:auto 1fr auto; min-height:0; }

/* ── small caps section labels ────────────────────────────────────────── */
.label {
  font:600 10.5px/1 var(--serif); letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); margin:0 0 10px; display:flex; align-items:center; gap:10px;
}
/* The frieze: an inscription between a hairline that runs out to the edge. */
.label::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--gilt) 0, var(--rule) 40%, transparent); opacity:.8; }
.label.spaced { margin-top:22px; }

/* ── accession: dropping a file ───────────────────────────────────────── */
.accession {
  border:1px dashed var(--rule); border-radius:3px; padding:16px 12px;
  text-align:center; color:var(--dim); font-size:12.5px; cursor:pointer;
  transition:border-color .15s, color .15s;
}
.accession:hover, .accession.over { border-color:var(--verdigris); color:var(--fg); }
.accession b { display:block; font:600 12.5px/1.5 var(--sans); color:var(--fg); }
.accession span { font:11px/1.5 var(--mono); color:var(--faint); }

.notice { font-size:12px; margin-top:10px; padding:7px 9px; border-radius:3px; display:none; line-height:1.45; }
.notice.ok  { display:block; background:color-mix(in srgb,var(--verdigris) 13%,transparent); color:var(--verdigris); }
.notice.bad { display:block; background:color-mix(in srgb,var(--amber) 14%,transparent); color:var(--amber); }

/* ── the rack ─────────────────────────────────────────────────────────── */
/* Cartridges inserted from other libraries stand on the rack as spines: a slab in the
   cartridge's colour with the name printed down it, the way a book announces itself
   edge-on. A scoped spine is pulled forward off the slot. Cartridge colours mean identity
   and nothing else -- they never appear on a control. */
.rack {
  display:flex; align-items:flex-end; gap:5px; padding:6px 4px 0;
  border-bottom:2px solid var(--rule); box-shadow:0 3px 0 -1px var(--rule-soft);
  margin-bottom:8px; overflow-x:auto; scrollbar-width:none;
}
.spine {
  --c:var(--dim);
  position:relative; width:var(--w,30px); height:164px; flex:0 0 var(--w,30px); cursor:pointer; border:0;
  border-radius:2px 2px 0 0; background:var(--c); color:#fff;
  box-shadow:inset -3px 0 0 rgba(0,0,0,.28), inset 1px 0 0 rgba(255,255,255,.18);
  display:flex; flex-direction:column; align-items:center; padding:6px 0 5px;
  transition:transform .18s ease, box-shadow .18s ease; user-select:none;
  transform-origin:bottom center;
}
.spine:hover { transform:translateY(-3px); }
.spine[aria-pressed=true] {
  transform:translateY(-8px) scale(1.04);
  box-shadow:inset -3px 0 0 rgba(0,0,0,.28), inset 1px 0 0 rgba(255,255,255,.3), 0 6px 14px rgba(0,0,0,.35);
}
.spine .swatch { width:14px; height:14px; opacity:.9; }
.spine .swatch svg { width:14px; height:14px; display:block; }
.spine .t {
  flex:1; writing-mode:vertical-rl; margin:6px 0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font:500 11px/1 var(--serif); letter-spacing:.03em;
}
.spine .n { font:9px/1 var(--mono); opacity:.8; }
.spine .lvl { position:absolute; left:0; right:0; bottom:0; height:3px; background:repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 3px, transparent 3px 6px); }
.spine[data-level=full] .lvl { display:none; }
.spine .eject {
  position:absolute; top:-18px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--rule); border-radius:2px; color:var(--faint);
  font:10px/1 var(--sans); padding:2px 5px; cursor:pointer; display:none; white-space:nowrap;
}
.spine:hover .eject, .spine:focus-within .eject { display:block; }
.spine .eject:hover { color:var(--amber); border-color:var(--amber); }
.spine.inserting { animation:insert .55s cubic-bezier(.2,.8,.2,1); }
@keyframes insert { 0% { transform:translate(-30px,-40px) rotate(-8deg); opacity:0; } 70% { transform:translate(0,-6px); } 100% { transform:none; opacity:1; } }
/* The empty slot: where a new cartridge would stand. */
.slot {
  width:30px; height:164px; flex:0 0 30px; border:1px dashed var(--rule); border-bottom:0;
  border-radius:2px 2px 0 0; background:none; color:var(--faint); cursor:pointer;
  display:grid; place-items:center; font:16px/1 var(--sans);
}
.slot:hover { color:var(--fg); border-color:var(--faint); }
.rack-note { font:10.5px/1.5 var(--mono); color:var(--faint); margin:-2px 0 6px; min-height:14px; }
/* The rack in three dimensions: one socket, one cartridge in view. Arrows or the wheel
   step through the others; "all" opens a grid to jump to one. */
.rack3d { position:relative; height:210px; margin:0 -6px 2px; }
.rack3d canvas { width:100%; height:100%; display:block; }
.rack3d .arrow { position:absolute; top:78px; width:26px; height:44px; background:none; border:0; color:var(--faint); font:22px/1 var(--serif); cursor:pointer; padding:0; }
.rack3d .arrow:hover { color:var(--fg); }
.rack3d .arrow.l { left:0; } .rack3d .arrow.r { right:0; }
.rack3d .arrow[disabled] { opacity:.25; cursor:default; }
.rack3d .under { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:baseline; justify-content:center; gap:10px; font:11px/1.4 var(--sans); color:var(--faint); pointer-events:none; }
.rack3d .under > * { pointer-events:auto; }
.rack3d .under .nm { font:500 12.5px/1.4 var(--serif); color:var(--dim); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
.rack3d .under[data-on=true] .nm { color:var(--verdigris); }
.rack3d .under .cnt { font:10px/1 var(--mono); }
.rack3d .slot2d { position:absolute; right:6px; top:6px; }
.rack3d .all { position:absolute; left:8px; top:6px; }
.rackgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:0 0 8px; }
.rackgrid button { display:flex; align-items:center; gap:7px; padding:6px 8px; background:var(--sunk); border:1px solid var(--rule); border-radius:3px; cursor:pointer; text-align:left; font:11.5px/1.3 var(--sans); color:var(--dim); }
.rackgrid button:hover { color:var(--fg); border-color:var(--faint); }
.rackgrid button[data-on=true] { border-color:var(--verdigris); color:var(--fg); }
.rackgrid .dot { width:8px; height:8px; flex:0 0 8px; border-radius:50%; background:var(--c); }
.rackgrid span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* ── the shelf itself ─────────────────────────────────────────────────── */
/* Volumes are grouped by subject. A volume with three subjects sits on three shelves,
   the way a subject index works; the collapse state remembers itself. */
.shelf-group { margin-bottom:4px; }
.shelf-h { display:flex; align-items:center; gap:6px; padding:6px 0 4px; }
.caret {
  background:none; border:0; padding:0 2px; cursor:pointer; color:var(--faint);
  font:11px/1 var(--mono); width:14px; transition:transform .15s;
}
.caret[aria-expanded=false] { transform:rotate(-90deg); }
.shelf-name {
  background:none; border:0; padding:0; cursor:pointer; text-align:left;
  font:600 10.5px/1.3 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
}
.shelf-name:hover { color:var(--fg); }
.shelf-name[aria-pressed=true] { color:var(--verdigris); }
.shelf-n { font:10px/1 var(--mono); color:var(--faint); margin-left:auto; }
.shelf-vols { padding-left:14px; border-left:1px solid var(--rule-soft); margin-left:6px; }
.shelf-group[data-open=false] > .shelf-vols, .shelf-sub[data-open=false] > .shelf-vols { display:none; }
/* Sub-shelves sit one step in, in a quieter voice than the top shelf. */
.shelf-sub { margin:2px 0; }
.shelf-sub .shelf-h { padding:4px 0 3px; }
.shelf-sub .shelf-name { text-transform:none; letter-spacing:0; font:500 12.5px/1.3 var(--serif); color:var(--dim); }
.shelf-sub .shelf-name[aria-pressed=true] { color:var(--verdigris); }
.shelf-h .linkish { margin-left:auto; }

.vol { padding:8px 0; border-bottom:1px solid var(--rule-soft); }
.vol:last-child { border-bottom:0; }
.vol-t {
  font:500 13px/1.4 var(--serif); hyphens:auto; -webkit-hyphens:auto; cursor:pointer;
  background:none; border:0; padding:0; text-align:left; color:var(--fg); width:100%;
}
.vol-t:hover { color:var(--verdigris); }
.vol.current .vol-t { color:var(--verdigris); }
.vol-m {
  display:flex; align-items:center; gap:7px; margin-top:4px;
  font:10.5px/1 var(--mono); color:var(--faint);
}
/* Reading state as a filled square: empty = listed, half = read, full = annotated. */
.state { width:8px; height:8px; flex:0 0 8px; border:1px solid var(--verdigris); border-radius:1px; }
.state.s1 { background:linear-gradient(to right,var(--verdigris) 50%,transparent 50%); }
.state.s2 { background:var(--verdigris); }
/* Where a volume came from: a dot in its cartridge's colour. */
.dot { width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:var(--c); }
.badge { font:9.5px/1 var(--mono); letter-spacing:.04em; color:var(--faint); border:1px solid var(--rule); border-radius:2px; padding:2px 4px; }
/* Actions stay out of the way until the volume is under the cursor. */
.vol-acts { display:flex; gap:10px; max-height:0; overflow:hidden; opacity:0;
            transition:max-height .15s, opacity .12s, margin-top .15s; margin-top:0; }
.vol:hover .vol-acts, .vol:focus-within .vol-acts { max-height:20px; opacity:1; margin-top:6px; }
.linkish {
  background:none; border:0; padding:0; cursor:pointer; color:var(--dim);
  font:11px/1 var(--sans); border-bottom:1px solid transparent;
}
.linkish:hover { color:var(--fg); border-bottom-color:var(--verdigris); }
.linkish.danger:hover { color:var(--amber); border-bottom-color:var(--amber); }

/* ── jobs ─────────────────────────────────────────────────────────────── */
.job { font:11px/1.5 var(--mono); color:var(--dim); padding:5px 0; }
.job .bar { display:block; height:2px; background:var(--rule); margin-top:5px; overflow:hidden; border-radius:1px; }
.job .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--gilt-lo), var(--gilt-hi)); transition:width .4s ease; }
.job.paused { color:var(--amber); }

/* ── views ────────────────────────────────────────────────────────────── */
.views {
  display:flex; align-items:center; gap:2px; padding:10px 22px 0;
  border-bottom:1px solid var(--rule); background:var(--bg);
}
.view-tab {
  background:none; border:0; cursor:pointer; padding:7px 12px 9px;
  font:500 12.5px/1 var(--sans); color:var(--faint);
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.view-tab:hover { color:var(--fg); }
.view-tab[aria-selected=true] { color:var(--fg); border-bottom-color:var(--gilt); }
.view-tab { font-family:var(--serif); letter-spacing:.06em; font-size:13px; }
.views .right { margin-left:auto; display:flex; align-items:center; gap:12px; padding-bottom:8px; }

/* The stance control: a button that opens to its options, and wears violet when set. */
.stance { position:relative; }
.stance > button {
  background:var(--sunk); color:var(--dim); border:1px solid var(--rule); border-radius:3px;
  font:11.5px/1 var(--sans); padding:4px 8px; cursor:pointer;
}
.stance > button[data-on=true] { color:var(--opinion); border-color:var(--opinion); }
.stance-menu {
  position:absolute; right:0; top:calc(100% + 6px); z-index:5; min-width:220px;
  background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); display:none;
}
.stance-menu[data-open=true] { display:block; }
.stance-menu p { margin:2px 6px 6px; font:10px/1.4 var(--sans); color:var(--faint); letter-spacing:.06em; text-transform:uppercase; }
.stance-opt {
  display:flex; align-items:baseline; gap:8px; width:100%; text-align:left;
  background:none; border:0; border-radius:3px; padding:6px 8px; cursor:pointer;
  font:13px/1.3 var(--serif); color:var(--fg);
}
.stance-opt:hover { background:var(--sunk); }
.stance-opt[aria-pressed=true] { color:var(--opinion); }
.stance-opt small { margin-left:auto; font:10px/1 var(--mono); color:var(--faint); }
.stance-pair { display:flex; gap:4px; }
.stance-pair .stance-opt { flex:1; }
.stance-pair .vs { align-self:center; font:10px/1 var(--mono); color:var(--faint); }
/* An answer given under a stance says so, in the stance colour, above the question. */
.stanced { font:600 10.5px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase;
           color:var(--opinion); margin-bottom:6px; }
.turn[data-stance] .asked { border-left-color:var(--opinion); }

select, .toggle {
  background:var(--sunk); color:var(--dim); border:1px solid var(--rule);
  border-radius:3px; font:11.5px/1 var(--sans); padding:4px 7px;
}
.toggle { display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
.toggle input { margin:0; accent-color:var(--verdigris); }

.pane { overflow-y:auto; min-height:0; padding:18px 22px 24px; }
/* The web: the library drawn as a network behind the Ask pane -- one node per volume,
   edges where volumes cite each other, share a thread, or sit close in meaning. It
   thickens as the library grows and lights where passages are being retrieved. */
#web { position:absolute; left:0; right:0; z-index:0; pointer-events:none; opacity:0; transition:opacity 1.2s ease; }
.views { position:relative; z-index:3; }  /* above the pane, so its menus are too */
#web[data-on=true] { opacity:1; }
.turn { position:relative; }
/* A faint wash behind the reading column keeps the text legible over the web. */
.said, .asked { background:linear-gradient(90deg, color-mix(in srgb, var(--bg) 78%, transparent) 0 70%, transparent); }
.said { border-radius:4px; }

/* ── subject chips ────────────────────────────────────────────────────── */
.subjects { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.subject {
  font:11px/1 var(--sans); padding:4px 9px; border:1px solid var(--rule);
  border-radius:99px; color:var(--dim); cursor:pointer; user-select:none;
  transition:border-color .12s, color .12s;
}
.subject:hover { color:var(--fg); border-color:var(--faint); }
.subject[aria-pressed=true] { color:var(--bg); background:var(--verdigris); border-color:var(--verdigris); }
.subject i { font-style:normal; font-family:var(--mono); font-size:10px; opacity:.65; margin-left:4px; }

/* ── the desk bar: which conversation, new, history ───────────────────── */
.deskbar { display:flex; align-items:baseline; gap:14px; margin:-4px 0 14px; font:11.5px/1.5 var(--sans); color:var(--faint); }
.deskbar .title { font:italic 12.5px/1.5 var(--serif); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:52ch; }
.deskbar .right { margin-left:auto; display:flex; gap:12px; }
.history { margin:0 0 18px; border:1px solid var(--rule); border-radius:4px; background:color-mix(in srgb, var(--panel) 85%, transparent); max-width:78ch; }
.history .row { display:grid; grid-template-columns:1fr auto auto; gap:6px 14px; align-items:baseline; padding:9px 12px; border-bottom:1px solid var(--rule-soft); cursor:pointer; }
.history .row:last-child { border-bottom:0; }
.history .row:hover { background:var(--sunk); }
.history .row[data-current=true] .t { color:var(--verdigris); }
.history .t { font:14px/1.45 var(--serif); color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.history .m { font:10.5px/1.5 var(--mono); color:var(--faint); white-space:nowrap; }
.history .m i { font-style:normal; color:var(--opinion); }
.history .del { font:11px/1 var(--sans); color:var(--faint); background:none; border:0; cursor:pointer; padding:0; }
.history .del:hover { color:var(--amber); }
.history .none { padding:12px; font:12.5px/1.6 var(--sans); color:var(--faint); }

/* ── the conversation ─────────────────────────────────────────────────── */
.turn { margin-bottom:26px; max-width:none; }
.asked {
  font:500 16px/1.5 var(--serif); color:var(--fg);
  padding-left:13px; border-left:2px solid var(--rule);
}
.asked .rewrote { display:block; margin-top:5px; font:11px/1.4 var(--mono); color:var(--faint); }

/* Signature: the reading column keeps its margin, and every [n] resolves
   into a note beside the paragraph that cites it. */
.said { margin-top:14px; display:grid; grid-template-columns:minmax(0,68ch) 200px; gap:0 28px; }
.said > * { grid-column:1; max-width:68ch; }
.said p, .said li { font:15.5px/1.72 var(--serif); }
.said p { margin:0 0 .85em; }
/* Answers and .md volumes are rendered as markdown: quiet headings, real lists, code
   that looks like code. Nothing shouts; the librarian's voice stays even. */
.md h1, .md h2, .md h3, .md h4 { font:600 15.5px/1.4 var(--serif); margin:1.1em 0 .4em; }
.md h1 { font-size:18px; } .md h2 { font-size:16.5px; }
.md ul, .md ol { margin:0 0 .85em; padding-left:1.4em; }
.md li { margin:.15em 0; }
.md li p { margin:0; }
.md code { font:13px/1.5 var(--mono); background:var(--sunk); border:1px solid var(--rule-soft); border-radius:3px; padding:0 4px; }
.md pre { margin:0 0 .95em; padding:10px 12px; background:var(--sunk); border:1px solid var(--rule-soft); border-radius:3px; overflow-x:auto; }
.md pre code { background:none; border:0; padding:0; font-size:12.5px; line-height:1.55; white-space:pre; }
.md blockquote { margin:0 0 .85em; padding-left:12px; border-left:2px solid var(--rule); color:var(--dim); }
.md hr { border:0; border-top:1px solid var(--rule); margin:1em 0; }
.md table { border-collapse:collapse; margin:0 0 .95em; font:13.5px/1.5 var(--sans); }
.md th, .md td { border:1px solid var(--rule); padding:4px 8px; text-align:left; vertical-align:top; }
.md a { color:inherit; text-decoration:underline dotted var(--faint); }
.md strong { font-weight:600; }
.said .apparatus { grid-column:2; align-self:start; padding-top:.3em; }
.mark {
  font:11px/1 var(--mono); color:var(--rubric); cursor:default;
  vertical-align:.25em; padding:0 1px; letter-spacing:-.02em;
}
.mark.lit { background:color-mix(in srgb,var(--rubric) 20%,transparent); border-radius:2px; }
.note {
  display:block; font:10.5px/1.45 var(--mono); color:var(--dim);
  padding:3px 0 3px 9px; border-left:1px solid var(--rubric); margin-bottom:6px;
}
.note b { display:block; color:var(--fg); font-weight:500; }
.note .pg { color:var(--rubric); }
/* Provenance stripe: the rubric rule still says "from the shelf"; the stripe beside it
   says whose shelf. */
.note.from { position:relative; }
.note.from::before { content:''; position:absolute; left:-5px; top:0; bottom:0; width:2px; background:var(--c); }
.note .who { display:block; color:var(--c); font-size:9.5px; letter-spacing:.04em; }
@media (max-width:1080px) {
  .said { grid-template-columns:minmax(0,1fr); }
  .said .apparatus { grid-column:1; display:flex; flex-wrap:wrap; gap:5px; padding:6px 0 0; }
  .note { border-left:0; border-top:1px solid var(--rubric); padding:4px 0 0; margin:0; max-width:230px; }
  .note.from::before { left:0; right:0; top:-4px; bottom:auto; width:auto; height:2px; }
}
.unsourced { font:11px/1.5 var(--mono); color:var(--faint); margin-top:6px; }
/* The murmur: the librarian's thinking, ghosted behind the shelf and drifting upward,
   like the library rifling through itself. Never in the answer column -- prose arrives
   there clean. Always on; it is the honest signal that a long wait is work, not a hang. */
/* It occupies the empty space beneath the question, anchored on the shelf's edge, and
   is masked by a radial bleed so the text is strongest where it leaves the shelf and
   dissolves as it drifts up and right into the page. */
.reading { position:relative; }
#murmur {
  position:absolute; left:0; right:35%; top:0; bottom:0; z-index:0; pointer-events:none;
  overflow:hidden; opacity:0; transition:opacity .7s ease;
  mask-image:radial-gradient(ellipse 85% 70% at 0% 62%, #000 0%, rgba(0,0,0,.55) 38%, transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse 85% 70% at 0% 62%, #000 0%, rgba(0,0,0,.55) 38%, transparent 72%);
}
#murmur[data-on=true] { opacity:1; }
/* A wash of the shelf's panel colour spills into the page with the text, so the bleed
   reads as light from the shelf, not floating type. */
#murmur::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 70% 60% at 0% 62%, color-mix(in srgb, var(--panel) 85%, var(--verdigris) 15%) 0%, transparent 70%);
}
#murmur .lines {
  position:absolute; left:22px; bottom:0; max-width:62ch;
  font:italic 13.5px/1.8 var(--serif); color:var(--dim); opacity:.75;
  white-space:pre-wrap; word-break:break-word;
}
.pane { position:relative; z-index:1; }
.composer { position:relative; z-index:1; }
@media (prefers-reduced-motion: reduce) { #murmur { transition:none; } }

.composer { border-top:1px solid var(--rule); background:var(--panel); padding:12px 22px 14px; }
.composer input {
  width:100%; background:var(--sunk); border:1px solid var(--rule); border-radius:3px;
  color:var(--fg); font:15px/1.5 var(--serif); padding:11px 13px;
}
.composer input::placeholder { color:var(--faint); font-family:var(--sans); font-size:13.5px; }
.composer input:focus { border-color:var(--verdigris); outline:none; }
.desk { margin-top:7px; font:11px/1 var(--mono); color:var(--faint); min-height:13px; }
.desk .working::after {
  content:'·'; animation:tick 1.1s steps(4,end) infinite; margin-left:3px;
}
@keyframes tick { 0%{content:'·'} 25%{content:'··'} 50%{content:'···'} 75%{content:'··'} }

/* ── search results ───────────────────────────────────────────────────── */
.hit { padding:13px 10px; margin:0 -10px; border-bottom:1px solid var(--rule-soft); max-width:calc(76ch + 20px); cursor:pointer; border-radius:3px;
       background:linear-gradient(90deg, color-mix(in srgb, var(--bg) 78%, transparent) 0 80%, transparent); transition:background .12s; }
.hit:hover, .hit.current { background:color-mix(in srgb, var(--verdigris) 9%, var(--bg)); box-shadow:inset 2px 0 0 var(--verdigris); }
.hit:last-child { border-bottom:0; }
.hit-h { display:flex; align-items:baseline; gap:9px; }
.hit-t { font:500 13.5px/1.4 var(--serif); }
.hit-pg { font:10.5px/1 var(--mono); color:var(--rubric); }
.hit-rk { margin-left:auto; font:10px/1 var(--mono); color:var(--faint); }
.hit-path { font:10.5px/1.4 var(--mono); color:var(--faint); margin:3px 0 6px; }
.hit-x { font:13px/1.6 var(--serif); color:var(--fg); opacity:.85; max-width:76ch;
         display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

/* ── library themes ───────────────────────────────────────────────────── */
.theme { padding:14px 0; border-bottom:1px solid var(--rule-soft); }
.theme:last-child { border-bottom:0; }
.theme-h { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.theme-t { font:600 14px/1.35 var(--serif); }
.theme-n { font:10.5px/1 var(--mono); color:var(--faint); }
.theme-s { font:13.5px/1.65 var(--serif); margin:6px 0 8px; max-width:74ch; opacity:.9; }
.spans { display:flex; flex-wrap:wrap; gap:5px; }
.span { font:10px/1 var(--mono); color:var(--dim); border:1px solid var(--rule); border-radius:2px; padding:3px 6px; }
.flag { font:10px/1 var(--mono); color:var(--amber); border:1px solid var(--amber); border-radius:2px; padding:2px 5px; }
.edge { font:11px/1.7 var(--mono); color:var(--dim); }
.edge em { font-style:normal; color:var(--faint); padding:0 5px; }
.edge b { color:var(--fg); font-weight:500; }
/* The highlighter: a marker-pen wash in amber (attention), never a box. */
mark.hl { background:color-mix(in srgb, var(--amber) 26%, transparent); color:inherit; padding:0 1px; border-radius:2px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
.hit-x .lift { color:var(--fg); opacity:1; font-weight:500; background:linear-gradient(transparent 62%, color-mix(in srgb, var(--amber) 22%, transparent) 62%); }
/* Threads: the reach of a thread decides how much room it gets. */
.tfilter { display:flex; align-items:center; gap:10px; margin:2px 0 12px; }
.tfilter input { flex:0 1 32ch; font:12.5px/1.4 var(--sans); padding:5px 8px; border:1px solid var(--rule); border-radius:3px; background:transparent; color:var(--fg); }
.tfilter span { font:10.5px/1 var(--mono); color:var(--faint); }
.theme { cursor:pointer; max-width:calc(74ch + 16px); }
.conflict { max-width:calc(88ch + 16px); }
.theme:hover { box-shadow:inset 2px 0 0 var(--verdigris); }
.theme .theme-h { padding-left:8px; } .theme .theme-s, .theme .spans { margin-left:8px; }
.theme.big .theme-t { font-size:15.5px; }
.theme.big .theme-s { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.theme.big.open .theme-s { display:block; }
.conflict .why { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.conflict.open .why { display:block; }
.more { font:10.5px/1 var(--mono); color:var(--faint); background:none; border:0; padding:6px 0 0; cursor:pointer; }
.more:hover { color:var(--fg); }
.theme.small { padding:0; border-bottom:0; max-width:calc(74ch + 16px); }
.theme.small > summary { list-style:none; padding:7px 8px; font:13px/1.4 var(--serif); display:flex; align-items:baseline; gap:9px; cursor:pointer; border-bottom:1px solid var(--rule-soft); }
.theme.small > summary::-webkit-details-marker { display:none; }
.theme.small > summary::before { content:'▸'; font:10px/1 var(--mono); color:var(--faint); }
.theme.small[open] > summary::before { content:'▾'; }
.theme.small > summary .theme-n { margin-left:auto; }
.theme.small .theme-s { margin:8px 0 8px 24px; } .theme.small .spans { margin:0 0 12px 24px; }
.conflict { padding:14px 0 16px; border-bottom:1px solid var(--rule-soft); }
.conflict-h { display:flex; align-items:baseline; gap:9px; }
.pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:9px 0 8px; max-width:88ch; }
.pair blockquote { margin:0; padding:9px 12px; border-left:2px solid var(--amber); font:13.5px/1.55 var(--serif); background:color-mix(in srgb, var(--amber) 6%, transparent); }
.pair blockquote cite { display:block; font:10.5px/1.4 var(--mono); font-style:normal; color:var(--amber); margin-bottom:5px; }
.conflict .why { font:12.5px/1.6 var(--serif); color:var(--dim); max-width:74ch; margin:0 0 6px; }
@media (max-width:700px) { .pair { grid-template-columns:1fr; } }

/* ── the reader ───────────────────────────────────────────────────────── */
.reader-h { margin-bottom:18px; }
.reader-t { font:600 22px/1.25 var(--serif); margin:0 0 6px; max-width:68ch; }
.reader-m { font:11px/1.6 var(--mono); color:var(--faint); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.toc { margin:14px 0 26px; padding:0; list-style:none; columns:2; column-gap:28px; max-width:68ch; }
.toc li { break-inside:avoid; font:12px/1.7 var(--sans); }
.toc a { color:var(--dim); text-decoration:none; }
.toc a:hover { color:var(--fg); }
.toc .l2 { padding-left:12px; } .toc .l3 { padding-left:24px; }
/* Text and marginalia share the apparatus grid: passage on the left, what the library
   thought about it on the right, aligned. */
.page { display:grid; grid-template-columns:minmax(0,68ch) 220px; gap:0 28px; }
.page h3 { grid-column:1; font:600 15px/1.35 var(--serif); margin:26px 0 8px; scroll-margin-top:12px; }
.page h3 small { font:10.5px/1 var(--mono); color:var(--faint); margin-left:8px; font-weight:400; }
.page .lead { grid-column:1; font:italic 13.5px/1.6 var(--serif); color:var(--dim); margin:0 0 12px;
              padding-left:11px; border-left:1px solid var(--rule); }
.page p.pass { grid-column:1; font:15px/1.72 var(--serif); margin:0 0 .85em; white-space:pre-wrap; }
.page .pass { grid-column:1; }
.page .pass.md { white-space:normal; margin:0 0 .85em; }
.page .pass.md > *:first-child { margin-top:0; }
.page .pass.md p, .page .pass.md li { font:15px/1.72 var(--serif); }
.page .gloss { grid-column:2; align-self:start; padding-top:.2em; }
.page figure { grid-column:1; margin:6px 0 18px; padding:10px 12px 8px; border:1px solid var(--line); border-radius:4px; background:rgba(255,255,255,.55); }
.page figure img { display:block; max-width:100%; height:auto; cursor:zoom-in; }
.page figure.wide img { cursor:zoom-out; }
.page figure figcaption { font:italic 12.5px/1.5 var(--serif); color:var(--dim); margin-top:8px; }
.page figure figcaption small { font:10.5px/1 var(--mono); font-style:normal; color:var(--faint); margin-left:6px; }
.page figure.wide { grid-column:1 / -1; }
.page .gloss span {
  display:block; font:12px/1.5 var(--serif); color:var(--dim);
  padding:2px 0 2px 10px; border-left:1px solid var(--rubric); margin-bottom:6px;
}
/* Their reading, beside yours: stripe in the cartridge colour, and named. */
.page .gloss span.theirs { position:relative; }
.page .gloss span.theirs::before { content:''; position:absolute; left:-5px; top:0; bottom:0; width:2px; background:var(--c); }
.page .gloss span.theirs i { display:block; font:9.5px/1.4 var(--mono); font-style:normal; color:var(--c); letter-spacing:.04em; }
.reader-m .dot { display:inline-block; vertical-align:middle; margin-right:5px; }
.reading-only { font:italic 13px/1.6 var(--serif); color:var(--dim); margin:0 0 18px; max-width:68ch; }

/* ── write ────────────────────────────────────────────────────────────── */
/* A brief in, a document out: the outline appears, then each section writes itself with
   its own margin notes, numbered across the whole document. */
.write .brief { width:100%; min-height:88px; resize:vertical; background:var(--sunk); border:1px solid var(--rule); border-radius:3px; color:var(--fg); font:15px/1.55 var(--serif); padding:11px 13px; }
.write .brief:focus { border-color:var(--verdigris); outline:none; }
.write .bar { display:flex; align-items:center; gap:14px; margin:10px 0 22px; flex-wrap:wrap; font:11.5px/1.4 var(--sans); color:var(--dim); }
.write .go { background:var(--sunk); color:var(--fg); border:1px solid var(--rule); border-radius:3px; font:13px/1 var(--sans); padding:8px 14px; cursor:pointer; }
.write .go:hover { border-color:var(--verdigris); }
.write .go[disabled] { opacity:.5; cursor:default; }
.doc h1.t { font:600 26px/1.25 var(--serif); margin:0 0 6px; max-width:68ch; }
.doc .plan { font:12px/1.6 var(--mono); color:var(--faint); margin:0 0 18px; max-width:68ch; }
.doc .outline { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 22px; }
.doc .outline span { font:11px/1 var(--sans); padding:4px 9px; border:1px solid var(--rule); border-radius:99px; color:var(--faint); }
.doc .outline span[data-state=writing] { color:var(--fg); border-color:var(--verdigris); }
.doc .outline span[data-state=done] { color:var(--dim); }
.doc .sec h2 { font:600 18px/1.35 var(--serif); margin:22px 0 8px; max-width:68ch; }
.doc .sec .said { margin-top:0; }
.doc .refs { margin-top:26px; padding-top:14px; border-top:1px solid var(--rule); max-width:78ch; }
.doc .refs h3 { font:600 12px/1.4 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:0 0 8px; }
.doc .refs div { font:11.5px/1.7 var(--mono); color:var(--dim); }
.doc .refs b { color:var(--rubric); font-weight:500; margin-right:6px; }
.doc .acts { display:flex; gap:16px; align-items:center; margin:18px 0 30px; flex-wrap:wrap; }
.doc .tally { font:11px/1.5 var(--mono); color:var(--faint); }
.saved { max-width:78ch; }
.saved .row { display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--rule-soft); font:13px/1.5 var(--serif); }
.saved .row .m { font:10.5px/1.5 var(--mono); color:var(--faint); }
@media print {
  body { display:block; background:#fff; color:#111; }
  .shelf, .views, .composer, .subjects, .deskbar, #web, #murmur, #mk-stage, #inspect, .masthead, .write .brief, .write .bar, .doc .acts, .doc .outline, .doc .plan, .saved { display:none !important; }
  .frame { display:block; } .pane { overflow:visible; padding:0; }
  .said { grid-template-columns:minmax(0,1fr) 200px; } .note { color:#444; border-left-color:#a8402a; } .mark { color:#a8402a; }
}

/* ── settings ─────────────────────────────────────────────────────────── */
.settings { max-width: 78ch; }
.settings h2 { font:600 20px/1.3 var(--serif); margin:0 0 14px; }
.settings .sect { margin-bottom:26px; }
.svc { display:flex; flex-wrap:wrap; gap:8px 18px; font:12.5px/1.6 var(--sans); color:var(--dim); }
.svc span::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; background:var(--verdigris); vertical-align:middle; }
.svc span[data-ok=false]::before { background:var(--amber); }
.svc span[data-ok=false] { color:var(--amber); }
.kv { width:100%; border-collapse:collapse; font:13px/1.5 var(--sans); }
.kv td { padding:5px 0; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
.kv td:first-child { color:var(--dim); width:34%; }
.kv td:nth-child(2) { font-family:var(--mono); font-size:12px; }
.kv td:last-child { color:var(--faint); font-size:11.5px; }
.kv code { font:11px/1 var(--mono); color:var(--faint); background:var(--sunk); padding:1px 5px; border-radius:2px; }
.acts { display:flex; flex-wrap:wrap; gap:14px; }
.incident { border:1px solid var(--rule); border-radius:4px; padding:10px 12px; margin-bottom:10px; background:color-mix(in srgb, var(--panel) 70%, transparent); }
.incident[data-resolved=true] { opacity:.55; }
.inc-h { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.inc-kind { font:600 13px/1.4 var(--mono); color:var(--amber); }
.inc-src { font:10px/1 var(--mono); color:var(--faint); letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--rule); padding:2px 5px; border-radius:2px; }
.inc-n { font:10.5px/1 var(--mono); color:var(--faint); }
.inc-t { margin-left:auto; font:10.5px/1 var(--mono); color:var(--faint); }
.inc-msg { font:13.5px/1.55 var(--serif); margin:6px 0 8px; word-break:break-word; }
.inc-acts { display:flex; gap:12px; align-items:center; }
.inc-detail { margin-top:8px; }
.inc-detail pre { margin:0; max-height:220px; overflow:auto; font:11px/1.5 var(--mono); background:var(--sunk); border:1px solid var(--rule-soft); border-radius:3px; padding:8px 10px; white-space:pre-wrap; color:var(--dim); }
/* The advice: the librarian's diagnosis, then steps to run by hand. Commands are shown to
   copy, never a button that runs them. */
.advice { margin-top:12px; padding:12px 14px; border-left:2px solid var(--verdigris); background:color-mix(in srgb, var(--verdigris) 6%, transparent); border-radius:0 4px 4px 0; }
.advice .cause { font:600 10.5px/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--verdigris); margin-bottom:6px; }
.advice .cause[data-c=defect] { color:var(--amber); }
.advice .diag { font:14px/1.6 var(--serif); margin:0 0 10px; }
.advice .diag p { font:14px/1.6 var(--serif); margin:0 0 .5em; }
.step { display:grid; grid-template-columns:22px 1fr; gap:4px 8px; margin:8px 0; }
.step .n { font:11px/1.6 var(--mono); color:var(--faint); text-align:right; }
.step b { font:500 13.5px/1.5 var(--serif); }
.step .why { grid-column:2; font:12px/1.5 var(--sans); color:var(--dim); }
.cmd { grid-column:2; display:flex; align-items:center; gap:8px; background:var(--sunk); border:1px solid var(--rule); border-radius:3px; padding:5px 8px; }
.cmd code { flex:1; font:12px/1.5 var(--mono); white-space:pre-wrap; word-break:break-all; }
.cmd .linkish { flex:0 0 auto; }
.cmd[data-doc=false] { border-color:color-mix(in srgb, var(--amber) 55%, var(--rule)); }
.cmd .undoc { flex:0 0 auto; font:10px/1 var(--mono); color:var(--amber); border:1px solid var(--amber); border-radius:2px; padding:2px 5px; }
.advice .refs { font:11px/1.6 var(--mono); color:var(--faint); margin-top:8px; }
.advice .issue { margin-top:10px; padding-top:10px; border-top:1px solid var(--rule-soft); }
.advice .issue a { color:var(--amber); font:13px/1.5 var(--sans); text-decoration:underline dotted; }
.advice .issue pre { margin:8px 0 0; max-height:200px; overflow:auto; font:11.5px/1.5 var(--mono); background:var(--sunk); border:1px solid var(--rule-soft); border-radius:3px; padding:8px 10px; white-space:pre-wrap; color:var(--dim); }
#tab-settings { margin-left:6px; }
#inc-badge { display:inline-block; margin-left:6px; min-width:16px; padding:2px 5px; border-radius:99px; background:var(--amber); color:var(--bg); font:600 10px/1 var(--mono); text-align:center; vertical-align:middle; }

/* ── the cartridge as an object ───────────────────────────────────────── */
/* The make panel keeps its column; the object turns in the space to the right. On the
   rack, hovering a spine lifts the cartridge into the same space. */
#mk-stage { position:absolute; right:24px; top:70px; width:min(46vw, 560px); height:min(70vh, 620px); pointer-events:none; }
#mk-stage canvas { width:100%; height:100%; display:block; }
.dials { display:grid; grid-template-columns:1fr; gap:8px; padding-top:4px; }
.dial { display:grid; grid-template-columns:86px 1fr 34px; gap:10px; align-items:center; font:11.5px/1.4 var(--sans); color:var(--dim); }
.dial input[type=range] { width:100%; accent-color:var(--verdigris); }
.dial output { font:10.5px/1 var(--mono); color:var(--faint); text-align:right; }
.mats { display:flex; flex-wrap:wrap; gap:6px; padding-top:4px; }
.mats button { font:11.5px/1 var(--sans); padding:5px 10px; border:1px solid var(--rule); border-radius:99px; background:var(--sunk); color:var(--dim); cursor:pointer; }
.mats button[aria-pressed=true] { color:var(--fg); border-color:var(--fg); }
.artpick { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font:12px/1.5 var(--sans); color:var(--dim); }
.artpick img { width:52px; height:52px; object-fit:cover; border-radius:3px; border:1px solid var(--rule); }
#inspect { position:absolute; right:24px; top:60px; width:400px; height:520px; z-index:4; pointer-events:none; opacity:0; transition:opacity .25s ease; }
#inspect[data-on=true] { opacity:1; }
#inspect canvas { width:100%; height:440px; display:block; }
#inspect .who { text-align:center; font:600 15px/1.4 var(--serif); color:var(--fg); }
#inspect .meta { text-align:center; font:10.5px/1.6 var(--mono); color:var(--faint); }
.make .locked { font:11px/1.5 var(--mono); color:var(--faint); }

/* ── make a cartridge ─────────────────────────────────────────────────── */
.make { max-width:62ch; }
.make h2 { font:600 20px/1.3 var(--serif); margin:0 0 4px; }
.make .why { font:13.5px/1.6 var(--serif); color:var(--dim); margin:0 0 20px; }
.make .row { display:grid; grid-template-columns:110px 1fr; gap:10px 14px; align-items:start; margin-bottom:14px; }
.make .row > label:first-child { font:600 10.5px/2.2 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
.make input[type=text] { width:100%; background:var(--sunk); border:1px solid var(--rule); border-radius:3px; color:var(--fg); font:14px/1.4 var(--serif); padding:7px 10px; }
.make input[type=text]:focus { border-color:var(--verdigris); outline:none; }
.swatches { display:flex; gap:6px; flex-wrap:wrap; padding-top:4px; }
.swatches button { width:22px; height:22px; border-radius:3px; border:2px solid transparent; cursor:pointer; background:var(--c); }
.swatches button[aria-pressed=true] { border-color:var(--fg); }
.glyphs { display:flex; gap:6px; flex-wrap:wrap; padding-top:4px; }
.glyphs button { width:26px; height:26px; border-radius:3px; border:1px solid var(--rule); background:var(--sunk); color:var(--dim); cursor:pointer; display:grid; place-items:center; }
.glyphs button svg { width:14px; height:14px; }
.glyphs button[aria-pressed=true] { color:var(--fg); border-color:var(--fg); }
.levels { display:flex; flex-direction:column; gap:6px; padding-top:2px; }
.levels label { display:grid; grid-template-columns:auto 1fr; gap:8px; align-items:start; font:13px/1.45 var(--serif); cursor:pointer; }
.levels input { margin:4px 0 0; accent-color:var(--verdigris); }
.levels small { display:block; color:var(--faint); font:11px/1.45 var(--sans); }
.make .preview { font:11.5px/1.7 var(--mono); color:var(--dim); border-top:1px solid var(--rule-soft); padding-top:10px; margin-top:6px; }
.make .preview b { color:var(--fg); font-weight:500; }
.make .go { margin-top:14px; background:var(--sunk); color:var(--fg); border:1px solid var(--rule); border-radius:3px; font:13px/1 var(--sans); padding:8px 14px; cursor:pointer; }
.make .go:hover { border-color:var(--verdigris); }
.make .go[disabled] { opacity:.5; cursor:default; }
@media (max-width:1080px) {
  .page { grid-template-columns:minmax(0,1fr); }
  .page .gloss { grid-column:1; margin:-4px 0 14px; }
}

.empty { font:12.5px/1.6 var(--sans); color:var(--faint); padding:10px 0; max-width:52ch; }
.empty b { color:var(--dim); font-weight:500; display:block; margin-bottom:3px; }
.invitation { padding:14vh 0 0; max-width:46ch; }
.invitation b { font:500 22px/1.3 var(--serif); color:var(--fg); display:block; margin-bottom:10px; }
.invitation span { font:14px/1.65 var(--serif); color:var(--dim); }
</style>
</head>
<body>

<header class="masthead">
  <h1 class="wordmark">The <b>Library</b></h1>
  <span class="holdings" id="holdings"></span>
  <span class="right">
    <button class="linkish" id="themer" title="Switch appearance">appearance</button>
  </span>
</header>

<div class="frame">
  <aside class="shelf">
    <p class="label">Accession</p>
    <div class="accession" id="drop" tabindex="0" role="button" aria-label="Add a document">
      <b>Drop documents or folders</b>
      <span>pdf · md · txt · rst — folders are walked · a cartridge .zip goes on the rack</span>
      <input type="file" id="file" multiple accept=".pdf,.md,.markdown,.txt,.rst,.zip" hidden/>
    </div>
    <div class="notice" id="notice" role="status"></div>

    <div id="jobs-wrap" hidden>
      <p class="label spaced">In hand</p>
      <div id="jobs"></div>
    </div>

    <p class="label spaced">Rack</p>
    <div class="rack3d" id="rack3d" hidden>
      <canvas id="rack-canvas"></canvas>
      <button class="arrow l" onclick="rackStep(-1)" title="Previous cartridge">‹</button>
      <button class="arrow r" onclick="rackStep(1)" title="Next cartridge">›</button>
      <button class="linkish all" onclick="rackGrid()" title="All cartridges">all</button>
      <button class="slot slot2d" style="height:30px;width:20px;font-size:13px" onclick="openMake()" title="Make a cartridge from this library">+</button>
      <div class="under" id="rack-under"></div>
    </div>
    <div class="rackgrid" id="rackgrid" hidden></div>
    <div class="rack" id="rack"></div>
    <div class="rack-note" id="rack-note"></div>

    <div class="shelf-h" style="padding:0"><p class="label spaced" style="margin-bottom:0">Shelf</p><button class="linkish" id="reshelve" onclick="reshelve(this)" title="Have the library organise its shelf: top shelves, sub-shelves, one place per volume">reshelve</button></div>
    <div class="acts" id="shelf-acts" style="gap:12px;margin:4px 0 2px;font:11px/1.5 var(--sans);color:var(--faint)"></div>
    <div id="shelf" style="margin-top:8px"></div>
  </aside>

  <main class="reading">
    <canvas id="web" data-on="false" aria-hidden="true"></canvas>
    <div id="murmur" data-on="false" aria-hidden="true"><div class="lines"></div></div>
    <nav class="views" role="tablist">
      <button class="view-tab" id="tab-ask"     role="tab" aria-selected="true"  onclick="setView('ask')">Ask</button>
      <button class="view-tab" id="tab-find"    role="tab" aria-selected="false" onclick="setView('find')">Find</button>
      <button class="view-tab" id="tab-threads" role="tab" aria-selected="false" onclick="setView('threads')">Threads</button>
      <button class="view-tab" id="tab-write"   role="tab" aria-selected="false" onclick="setView('write')" title="Compose a document from the library">Write</button>
      <button class="view-tab" id="tab-open"    role="tab" aria-selected="false" onclick="setView('open')" hidden>Open</button>
      <button class="view-tab" id="tab-make"    role="tab" aria-selected="false" onclick="setView('make')" hidden>Make a cartridge</button>
      <button class="view-tab" id="tab-settings" role="tab" aria-selected="false" onclick="setView('settings')" title="Services, models, maintenance, incidents">Settings<span id="inc-badge" hidden></span></button>
      <span class="right">
        <select id="model" title="Switching models takes a moment"></select>
        <select id="effort" title="How much work the librarian does around the model: quick is a lookup; deep breaks the question into several searches first">
          <option value="quick">quick</option><option value="normal" selected>normal</option><option value="deep">deep</option>
        </select>
        <span class="stance">
          <button id="stance-btn" data-on="false" aria-haspopup="true" aria-expanded="false" onclick="toggleStanceMenu()">stance</button>
          <div class="stance-menu" id="stance-menu" role="menu"></div>
        </span>
        <label class="toggle"><input type="checkbox" id="multi" checked/> remembers</label>
      </span>
    </nav>

    <div class="pane" id="pane">
      <div class="subjects" id="subjects"></div>
      <div class="deskbar" id="deskbar">
        <span class="title" id="conv-title">New conversation</span>
        <span class="right">
          <button class="linkish" onclick="newChat()" title="Start a fresh conversation; the library forgets this one's thread">new</button>
          <button class="linkish" id="hist-btn" onclick="toggleHistory()" title="Earlier conversations">history</button>
        </span>
      </div>
      <div class="history" id="history" hidden></div>
      <div id="view-ask"></div>
      <div id="view-find" hidden></div>
      <div id="view-threads" hidden></div>
      <div id="view-open" hidden></div>
      <div id="view-make" hidden></div>
      <div id="view-settings" hidden></div>
      <div id="view-write" hidden></div>
    </div>
    <div id="mk-stage" hidden><canvas id="mk-canvas"></canvas></div>
    <div id="inspect" data-on="false" aria-hidden="true"><canvas id="inspect-canvas"></canvas><div class="who" id="inspect-who"></div><div class="meta" id="inspect-meta"></div></div>

    <form class="composer" id="composer" autocomplete="off">
      <input id="entry" placeholder="Ask the library something" aria-label="Ask the library"/>
      <div class="desk" id="desk"></div>
    </form>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATE = ['listed','read','annotated'];

let view = 'ask', convId = null, subjects = new Set(), sources = [], busy = false;
// Scoped cartridges (a "room"), and what the rack knows about each one.
let cartridges = new Set(), rackIndex = {}, palette = [];
let stance = null, stanceMeta = [], thinkingModels = {};
// The murmur keeps the last few hundred characters of thinking and drifts them upward.
const murmur = {
  el: null, lines: null, text: '',
  start(under) {
    this.el = $('#murmur'); this.lines = this.el.querySelector('.lines');
    this.text = ''; this.lines.textContent = '';
    // Fill the empty space between the question and the composer.
    const main = $('.reading').getBoundingClientRect();
    const top = under ? under.getBoundingClientRect().bottom - main.top + 12 : main.height * .35;
    const bottom = main.bottom - $('#composer').getBoundingClientRect().top + 8;
    this.el.style.top = `${Math.max(0, top)}px`;
    this.el.style.bottom = `${bottom}px`;
    this.el.dataset.on = 'true';
  },
  add(piece) {
    // Bottom-anchored, so new text pushes the old upward: a column drifting up out of
    // the shelf's edge.
    this.text = (this.text + piece).slice(-2200);
    this.lines.textContent = this.text;
  },
  stop() { if (!this.el) return; this.el.dataset.on = 'false';
           setTimeout(() => { if (this.el.dataset.on === 'false') { this.lines.textContent = ''; this.text = ''; } }, 700); },
};
localStorage.removeItem('showThinking');

/* ── the web ──────────────────────────────────────────────────────────── */
// The library as a nebula. A force layout in three dimensions -- repulsion between all
// volumes, springs along edges, gravity to the centre and a gentler pull toward each
// sub-shelf's own centroid so shelves read as regions of the cloud -- projected with
// perspective and turning slowly. Far volumes dim and shrink; each carries a soft haze in
// its shelf's colour, blended additively, which is what makes it a nebula rather than a
// diagram. Retrieval lights the volumes it drew on in rubric. Plain canvas, no library.
const web = {
  canvas: null, ctx: null, nodes: [], edges: [], byId: {}, alpha: 0, frame: null,
  scanning: false, scanT: 0, hueOf: {}, theta: 0, last: 0, R: 240, extent: 0,
  // The camera: where it looks and how close. Find moves it to the hits; Ask leaves it wide.
  cam: { x: 0, y: 0, z: 0, zoom: 1 }, camTo: { x: 0, y: 0, z: 0, zoom: 1 }, hovered: null,
  // The tour: findings visited one after another, each with a quick spin into view. A
  // hover takes the wheel; letting go hands it back.
  tour: { ids: [], i: -1, timer: null, manual: false, at: null }, spinV: 0, anchor: .55,
  HUES: [206, 34, 96, 326, 172, 44, 262, 0],
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
  async load() {
    let r; try { r = await (await fetch('/api/library/web')).json(); } catch { return; }
    const seen = new Set();
    for (const n of r.nodes) {
      seen.add(n.id);
      let node = this.byId[n.id];
      if (!node) {
        // Born somewhere inside the cloud; the forces take it from there.
        const a = Math.random() * Math.PI * 2, b = Math.acos(2 * Math.random() - 1), d = this.R * .5 * Math.cbrt(Math.random());
        node = this.byId[n.id] = { x: d * Math.sin(b) * Math.cos(a), y: d * Math.sin(b) * Math.sin(a), z: d * Math.cos(b), vx: 0, vy: 0, vz: 0, r: 0, lit: 0 };
        this.nodes.push(node);
        this.alpha = Math.max(this.alpha, 1);
      }
      Object.assign(node, { id: n.id, t: n.t, top: n.top, sub: n.sub, c: n.c, tier: n.tier, target: 2 + Math.sqrt(n.n || 1) * .5 });
    }
    const before = this.nodes.length;
    this.nodes = this.nodes.filter(n => seen.has(n.id));
    for (const id of Object.keys(this.byId)) if (!seen.has(id)) delete this.byId[id];
    if (this.nodes.length !== before) this.alpha = Math.max(this.alpha, .4);
    const had = this.edges.length;
    this.edges = r.edges.filter(e => this.byId[e.a] && this.byId[e.b]).map(e => ({ a: this.byId[e.a], b: this.byId[e.b], w: e.w, k: e.k }));
    if (this.edges.length !== had) this.alpha = Math.max(this.alpha, .3);
    const tops = [...new Set(this.nodes.map(n => n.top).filter(Boolean))].sort();
    this.hueOf = Object.fromEntries(tops.map((t, i) => [t, this.HUES[i % this.HUES.length]]));
    // The cloud's radius grows with the library, gently.
    this.R = 150 + 14 * Math.sqrt(this.nodes.length);
    this.canvas.dataset.on = String((view === 'ask' || view === 'find' || view === 'threads') && this.nodes.length > 0);
    this.wake();
  },
  size() {
    const main = $('.reading'); const dpr = Math.min(2, devicePixelRatio || 1);
    const pane = $('#pane').getBoundingClientRect(), box = main.getBoundingClientRect();
    this.canvas.style.top = (pane.top - box.top) + 'px'; this.canvas.style.height = pane.height + 'px';
    const w = main.clientWidth, h = Math.max(1, Math.round(pane.height));
    if (this.canvas.width !== w * dpr || this.canvas.height !== h * dpr) {
      this.canvas.width = w * dpr; this.canvas.height = h * dpr;
      this.canvas.style.width = w + 'px';
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    this.w = w; this.h = h;
  },
  tick() {
    const N = this.nodes;
    const g = {};
    for (const n of N) { if (!n.sub) continue; const s = (g[n.sub] ||= { x: 0, y: 0, z: 0, n: 0 }); s.x += n.x; s.y += n.y; s.z += n.z; s.n++; }
    for (let i = 0; i < N.length; i++) {
      const a = N[i];
      for (let j = i + 1; j < N.length; j++) {
        const b = N[j]; let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
        const d2 = Math.max(400, dx * dx + dy * dy + dz * dz);
        if (d2 > 48000) continue;
        const k = a.sub && a.sub === b.sub ? 220 : 420;   // same shelf sits closer
        const f = k / d2; dx *= f; dy *= f; dz *= f;
        a.vx -= dx; a.vy -= dy; a.vz -= dz; b.vx += dx; b.vy += dy; b.vz += dz;
      }
      a.vx -= a.x * .02; a.vy -= a.y * .02; a.vz -= a.z * .02;
      const s = a.sub && g[a.sub];
      if (s && s.n > 1) { a.vx += (s.x / s.n - a.x) * .035; a.vy += (s.y / s.n - a.y) * .035; a.vz += (s.z / s.n - a.z) * .035; }
    }
    for (const e of this.edges) {
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y, dz = e.b.z - e.a.z, d = Math.hypot(dx, dy, dz) || 1;
      const want = e.k === 'cite' ? 40 : e.k === 'thread' ? 50 : 66;
      const f = (d - want) / d * (.03 + .04 * e.w);
      e.a.vx += dx * f; e.a.vy += dy * f; e.a.vz += dz * f; e.b.vx -= dx * f; e.b.vy -= dy * f; e.b.vz -= dz * f;
    }
    const dists = [];
    for (const n of N) {
      n.vx *= .8; n.vy *= .8; n.vz *= .8;
      const sp = Math.hypot(n.vx, n.vy, n.vz); if (sp > 6) { const k = 6 / sp; n.vx *= k; n.vy *= k; n.vz *= k; }
      n.x += n.vx * this.alpha; n.y += n.vy * this.alpha; n.z += n.vz * this.alpha;
      const d = Math.hypot(n.x, n.y, n.z); if (d > this.R) { const k = this.R / d; n.x *= k; n.y *= k; n.z *= k; }
      dists.push(d);
      n.r += (n.target - n.r) * .08;
    }
    // Scale the view to where most of the cloud is: a few outliers must not shrink it.
    dists.sort((a, b) => a - b);
    const ext = Math.max(40, dists[Math.floor(dists.length * .92)] || 40);
    const target = Math.min(ext, this.R);
    this.extent = this.extent ? this.extent + (target - this.extent) * .05 : target;
    this.alpha *= .992;
  },
  project(n) {
    // Look from the camera's point, turn about the vertical axis, tilt a little, then
    // perspective. The cloud keeps turning around whatever the camera is looking at.
    const c = this.cam, ct = Math.cos(this.theta), st = Math.sin(this.theta), tilt = .38;
    const px = n.x - c.x, py = n.y - c.y, pz = n.z - c.z;
    const x = px * ct + pz * st, z0 = -px * st + pz * ct;
    const y = py * Math.cos(tilt) - z0 * Math.sin(tilt), z = py * Math.sin(tilt) + z0 * Math.cos(tilt);
    const E = this.extent || this.R;
    const f = 720, s = f / (f + z + E * .6);
    const fit = Math.min(this.w / (E * 2.6), this.h / (E * 2.3)) * c.zoom;
    return { x: this.w * this.anchor + x * s * fit, y: this.h * .5 + y * s * fit, s: s * fit, depth: (z + this.R) / (2 * this.R) };
  },
  // Glide the camera to the centroid of these volumes, close enough that their spread
  // fills the view. No ids: back out to the whole cloud.
  focus(ids) {
    clearTimeout(this.tour.timer);
    const list = [...new Set((ids || []).filter(id => this.byId[id]))];
    this.tour = { ids: list, i: -1, timer: null, manual: false, at: null };
    if (!list.length) { this.camTo = { x: 0, y: 0, z: 0, zoom: 1 }; this.anchor = .55; this.hovered = null; this.wake(); return; }
    // A beat on the whole region first, then the tour begins.
    const ns = list.map(id => this.byId[id]);
    const cx = ns.reduce((a, n) => a + n.x, 0) / ns.length, cy = ns.reduce((a, n) => a + n.y, 0) / ns.length, cz = ns.reduce((a, n) => a + n.z, 0) / ns.length;
    const spread = Math.max(30, ...ns.map(n => Math.hypot(n.x - cx, n.y - cy, n.z - cz)));
    const E = this.extent || this.R;
    this.camTo = { x: cx, y: cy, z: cz, zoom: Math.max(1.2, Math.min(3.4, E / (spread * 1.6 + 40))) };
    this.anchor = .62;
    this.tour.timer = setTimeout(() => this.next(), 900);
    this.wake();
  },
  // Dive on one volume: tight, off to the right so the list stays clear, with a quick
  // spin so it arrives rather than merely enlarges.
  look(id, { spin = true } = {}) {
    const n = this.byId[id]; if (!n) return;
    const E = this.extent || this.R;
    this.camTo = { x: n.x, y: n.y, z: n.z, zoom: Math.max(3.2, Math.min(6, E / 55)) };
    this.anchor = .68;
    this.hovered = n; this.tour.at = id;
    if (spin && !this.reduced) this.spinV = 2.4 * (Math.random() < .5 ? -1 : 1);
    n.lit = Math.max(n.lit, 1);
    for (const el of document.querySelectorAll('.hit')) el.classList.toggle('current', el.dataset.doc === id);
    this.wake();
  },
  next() {
    const tr = this.tour;
    if (!tr.ids.length || tr.manual || view !== 'find') return;
    tr.i = (tr.i + 1) % tr.ids.length;
    this.look(tr.ids[tr.i]);
    clearTimeout(tr.timer);
    tr.timer = setTimeout(() => this.next(), 3200);
  },
  // Hovering a finding takes the wheel; leaving gives the tour a moment, then it resumes.
  hover(id) {
    const tr = this.tour;
    clearTimeout(tr.timer);
    if (id) { tr.manual = true; tr.i = Math.max(0, tr.ids.indexOf(id)); this.look(id); return; }
    tr.manual = false;
    if (tr.ids.length) tr.timer = setTimeout(() => this.next(), 1800);
    else { this.hovered = null; this.wake(); }
  },
  draw(now) {
    const c = this.ctx; c.clearRect(0, 0, this.w, this.h);
    const dark = !document.documentElement.dataset.theme ? matchMedia('(prefers-color-scheme: dark)').matches : document.documentElement.dataset.theme === 'dark';
    // Ink: pale on slate at night; on papyrus by day, a sepia that multiplies into the
    // page like a star chart drawn on it rather than a grey cloud sitting on it.
    const ink = dark ? '221,226,234' : '92,72,48';
    const css = getComputedStyle(document.documentElement);
    const rubric = css.getPropertyValue('--rubric').trim(), verd = css.getPropertyValue('--verdigris').trim();
    const P = new Map(); for (const n of this.nodes) P.set(n, this.project(n));
    const colour = (n, l, a) => n.c ? n.c : n.top && this.hueOf[n.top] != null ? `hsl(${this.hueOf[n.top]} ${dark ? 45 : 42}% ${l}% / ${a})` : `rgba(${ink},${a})`;
    // edges, faint, fading with depth
    c.lineWidth = .7;
    for (const e of this.edges) {
      const a = P.get(e.a), b = P.get(e.b), depth = 1 - (a.depth + b.depth) / 2;
      const lit = Math.min(e.a.lit, e.b.lit);
      // By day the chart is its lines: the haze is nearly gone, so the edges carry it.
      const ek = dark ? (e.k === 'cite' ? .26 : e.k === 'thread' ? .18 : .08) : (e.k === 'cite' ? .3 : e.k === 'thread' ? .2 : .09);
      c.strokeStyle = lit > .05 ? rubric : `rgba(${ink},${ek * e.w * (.35 + .65 * depth)})`;
      c.globalAlpha = lit > .05 ? .2 + .6 * lit : 1;
      c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    }
    c.globalAlpha = 1;
    // the haze: additive, so overlapping volumes brighten into a cloud
    c.globalCompositeOperation = dark ? 'lighter' : 'multiply';
    const order = [...this.nodes].sort((m, n) => P.get(n).depth - P.get(m).depth);
    for (const n of order) {
      const p = P.get(n), near = 1 - p.depth, R = (n.r * 9 + 18) * p.s;
      const grd = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
      const hazeA = (dark ? .17 : .014) * (.4 + .6 * near);
      if (n.lit > .02) { grd.addColorStop(0, rubric); c.globalAlpha = (dark ? .5 : .22) * n.lit; n.lit *= .992; }
      else { grd.addColorStop(0, colour(n, dark ? 62 : 45, 1)); c.globalAlpha = hazeA; }
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = grd; c.beginPath(); c.arc(p.x, p.y, R, 0, Math.PI * 2); c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    // the volumes themselves
    for (const n of order) {
      const p = P.get(n), near = 1 - p.depth;
      c.globalAlpha = (n.tier === 0 ? (dark ? .3 : .32) : (dark ? .55 : .6)) * (.35 + .65 * near);
      c.fillStyle = n.lit > .02 ? rubric : colour(n, dark ? 70 : 40, 1);
      c.beginPath(); c.arc(p.x, p.y, Math.max(.6, n.r * p.s), 0, Math.PI * 2); c.fill();
      if (n.tier >= 2) { c.lineWidth = .7; c.strokeStyle = c.fillStyle; c.beginPath(); c.arc(p.x, p.y, n.r * p.s + 2, 0, Math.PI * 2); c.stroke(); }
    }
    c.globalAlpha = 1;
    // the finding under the eye: ringed in verdigris, a pulse, a leader line, and the
    // title set large enough to read from across the room
    if (this.hovered && P.has(this.hovered)) {
      const n = this.hovered, p = P.get(n), r = Math.max(4, n.r * p.s + 5);
      const pulse = (now / 900) % 1;
      c.strokeStyle = verd; c.lineWidth = 1.6; c.globalAlpha = .95;
      c.beginPath(); c.arc(p.x, p.y, r, 0, Math.PI * 2); c.stroke();
      c.lineWidth = 1; c.globalAlpha = .5 * (1 - pulse);
      c.beginPath(); c.arc(p.x, p.y, r + 4 + pulse * 26, 0, Math.PI * 2); c.stroke();
      // label block: to the right of the dot when there is room, else to the left
      const fg = css.getPropertyValue('--fg').trim(), dim = css.getPropertyValue('--dim').trim();
      const title = (n.t || '').slice(0, 60), sub = [n.top, n.sub].filter(Boolean).join(' › ');
      c.font = '600 19px "Iowan Old Style", Charter, Georgia, serif';
      const tw = c.measureText(title).width;
      c.font = '11px ui-monospace, Menlo, monospace';
      const sw = c.measureText(sub).width;
      const bw = Math.max(tw, sw), right = p.x + r + 44 + bw < this.w - 12;
      const lx = right ? p.x + r + 44 : p.x - r - 44 - bw, ly = p.y - 8;
      c.strokeStyle = verd; c.globalAlpha = .7; c.lineWidth = 1;
      c.beginPath(); c.moveTo(right ? p.x + r + 2 : p.x - r - 2, p.y); c.lineTo(right ? lx - 10 : lx + bw + 10, p.y); c.stroke();
      c.globalAlpha = .96; c.fillStyle = fg;
      c.font = '600 19px "Iowan Old Style", Charter, Georgia, serif';
      c.fillText(title, lx, ly);
      c.fillStyle = dim; c.font = '11px ui-monospace, Menlo, monospace';
      c.fillText(sub, lx, ly + 18);
      c.globalAlpha = 1;
    }
    // retrieval: a ring travelling out through the cloud, verdigris
    if (this.scanning || this.scanT > 0) {
      const t = ((now / 1400) % 1), R = t * Math.max(this.w, this.h) * .6;
      c.strokeStyle = verd; c.globalAlpha = (1 - t) * .3 * (this.scanning ? 1 : this.scanT);
      c.lineWidth = 1.2; c.beginPath(); c.arc(this.w * .55, this.h * .5, R, 0, Math.PI * 2); c.stroke();
      c.globalAlpha = 1; if (!this.scanning) this.scanT = Math.max(0, this.scanT - .02);
    }
  },
  loop(now) {
    this.frame = null;
    this.size();
    const dt = this.last ? Math.min(.1, (now - this.last) / 1000) : 0; this.last = now;
    if (!this.reduced && this.canvas.dataset.on === 'true') this.theta += dt * (2 * Math.PI / 110);  // one turn in ~two minutes
    // The spin: an impulse that decays, so a dive arrives with a swing and settles.
    this.theta += this.spinV * dt; this.spinV *= Math.pow(.05, dt);
    if (this.alpha > .003) this.tick();
    const c = this.cam, g = this.camTo, k = 1 - Math.pow(.004, dt || .016);  // ~95% of the way in half a second
    c.x += (g.x - c.x) * k; c.y += (g.y - c.y) * k; c.z += (g.z - c.z) * k; c.zoom += (g.zoom - c.zoom) * k;
    this.draw(now);
    const on = this.canvas.dataset.on === 'true';
    const moving = Math.abs(this.cam.zoom - this.camTo.zoom) > .002 || Math.hypot(this.cam.x - this.camTo.x, this.cam.y - this.camTo.y, this.cam.z - this.camTo.z) > .5 || Math.abs(this.spinV) > .01;
    if (on || this.alpha > .003 || moving) this.frame = requestAnimationFrame(t => this.loop(t));
    else this.last = 0;
  },
  wake() { if (!this.frame) this.frame = requestAnimationFrame(t => this.loop(t)); },
  light(ids) { for (const id of ids) { const n = this.byId[id]; if (n) n.lit = 1; } this.wake(); },
  scan(on) { this.scanning = on; if (!on) this.scanT = 1; this.wake(); },
  init() {
    this.canvas = $('#web'); this.ctx = this.canvas.getContext('2d');
    this.size(); this.load();
    addEventListener('resize', () => this.wake());
    setInterval(() => this.load(), 30000);
    // Keep the turn going only while the pane is in view.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.wake(); });
  },
};

function setView(v) {

  for (const k of ['ask','find','threads','open','make','settings','write']) {
    $('#view-' + k).hidden = k !== v;
    const t = $('#tab-' + k); t.setAttribute('aria-selected', String(k === v));
  }
  $('#composer').hidden = v === 'threads' || v === 'open' || v === 'make' || v === 'settings' || v === 'write';
  const e = $('#entry');
  e.placeholder = placeholderFor(v);
  $('#subjects').hidden = v === 'threads' || v === 'open' || v === 'settings';
  $('#deskbar').hidden = v !== 'ask';
  $('#mk-stage').hidden = v !== 'make';
  if (v !== 'ask') $('#history').hidden = true;
  if (v === 'threads') loadThreads();
  if (v === 'make') renderMake();
  if (v === 'settings') loadSettings();
  if (v === 'write') renderWrite();
  $('#web').dataset.on = String((v === 'ask' || v === 'find' || v === 'threads') && web.nodes.length > 0);
  if (v !== 'find' && v !== 'threads') { clearTimeout(web.tour.timer); web.focus(null); }
  web.wake();
  e.focus();
}
// One cartridge scoped is a room you have walked into; the composer says so.
function roomName() {
  if (cartridges.size !== 1) return null;
  return rackIndex[[...cartridges][0]]?.name || null;
}
function placeholderFor(v) {
  const room = roomName();
  if (v === 'ask') return room ? `Ask ${room}'s shelf` : 'Ask the library something';
  return room ? `Search ${room}'s shelf` : 'Search for a passage';
}

/* ── shelf ────────────────────────────────────────────────────────────── */
let catIndex = {};          // name -> id, so shelf headers can drive the same filter as the chips
let openDoc = null;
const collapsed = new Set(JSON.parse(localStorage.getItem('shelf.collapsed') || '[]'));

function volHtml(d) {
  const c = d.cartridge;
  return `
    <div class="vol ${d.id === openDoc ? 'current' : ''}">

        ${d.readings_only ? `<span class="badge" title="The owner shared their reading, not the text">reading only</span>` : ''}
        <span>·</span>

        <span>·</span>

      </div>
